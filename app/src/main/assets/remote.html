<style>
  :root {
    --bg: #f4f6fb;
    --bg-soft: #eef1f8;
    --card: #ffffff;
    --ink: #17203a;
    --muted: #64718c;
    --primary: #4353e6;
    --primary-2: #3344d0;
    --primary-soft: #eceefd;
    --accent: #f76707;
    --green: #0f9d58;
    --green-bg: #e6f6ee;
    --red: #d93025;
    --red-bg: #fdeceb;
    --amber: #b26a00;
    --amber-bg: #fdf3e0;
    --blue-bg: #e8eefc;
    --line: #e3e8f2;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(23,32,58,.05);
    --shadow: 0 1px 2px rgba(23,32,58,.04), 0 10px 28px rgba(23,32,58,.07);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); margin: 0; padding: 0 0 92px; color: var(--ink); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); box-shadow: 0 1px 8px rgba(23,32,58,.04); }
  .topbar-in { max-width: 880px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; margin-right: auto; color: var(--ink); cursor: pointer; }
  .brand small { display: block; font-weight: 500; font-size: 10.5px; opacity: .6; letter-spacing: .3px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s ease; }
  .pill:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .pill.primary { background: var(--primary); border-color: transparent; color: #fff; box-shadow: 0 2px 6px rgba(67,83,230,.22); }
  .pill.primary:hover { background: var(--primary-2); color: #fff; }
  .wrap { max-width: 880px; margin: 18px auto 0; padding: 0 16px; }
  .status-card { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; box-shadow: var(--shadow-sm); margin-bottom: 14px; font-size: 12.5px; color: var(--muted); }
  .status-card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; box-shadow: 0 0 0 3px var(--green-bg); }
  .status-card b { color: var(--ink); font-weight: 700; }
  .status-card .st-item { display: inline-flex; align-items: center; gap: 5px; line-height: 1.35; white-space: nowrap; }
  .status-card .st-sep { opacity: .45; }
  .status-card .st-warn { color: #e53935; font-weight: 600; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .toolbar button { padding: 8px 14px; font-size: 13px; font-weight: 600; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: all .15s ease; }
  .toolbar button:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .seg { display: flex; gap: 4px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s ease; }
  .seg button.on { background: var(--card); color: var(--primary); box-shadow: 0 2px 6px rgba(23,32,58,.10); }
  form { display: flex; flex-direction: column; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select { font-size: 15px; padding: 11px 13px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; transition: border-color .15s ease, box-shadow .15s ease; }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .form-row { display: flex; gap: 10px; }

  #status { color: var(--red); margin: 4px 0 12px; font-size: 13px; font-weight: 600; }

  li.item:hover { box-shadow: var(--shadow); }

  .bar { height: 3px; background: #e9edf5; border-radius: 999px; overflow: hidden; margin: 7px 0 0; }
  .fill { height: 100%; background: linear-gradient(90deg, #ffa94d, var(--accent)); width: 0; border-radius: 999px; transition: width .5s ease; }

  .speed-total .st-sub { color: var(--muted); font-weight: 600; font-size: 11px; }
  .item-menu-btn, .fs-more-btn { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; align-self: center; transition: color .15s ease, border-color .15s ease, background .15s ease; }
  .item-menu-btn:hover, .fs-more-btn:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
  .conn-banner { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; background: #b00020; color: #fff; font-size: 13px; font-weight: 600; padding: 8px 14px; }
  .conn-banner button { border: 0; border-radius: 999px; background: #fff; color: #b00020; font-weight: 700; font-size: 12.5px; padding: 6px 14px; cursor: pointer; }
  .gal-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .gal-search { margin-bottom: 10px; }
  .gal-toolbar h2 { margin: 0; font-size: 16px; }
  .gal-toolbar .count { font-size: 12px; color: var(--muted); }
  .gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px 14px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item:focus-visible, .fs-row:focus-visible, .fs-root:focus-visible, .gal-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
  .app-footer { position: fixed; left: 0; right: 0; bottom: 0; text-align: center; color: var(--muted); font-size: 11.5px; padding: 8px 0; background: var(--bg); border-top: 1px solid var(--line); z-index: 45; }
  .gal-cell { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .15s ease; }
  .gal-cell:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .gal-thumb { position: relative; aspect-ratio: 16 / 9; background: #1c2230; overflow: hidden; }
  .gal-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gal-thumb .ext { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9aa4b2; font-size: 22px; font-weight: 800; text-transform: uppercase; }
  .gal-thumb .gal-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.18); }
  .gal-thumb .gal-play span { width: 0; height: 0; border-top: 14px solid transparent; border-bottom: 14px solid transparent; border-left: 22px solid rgba(255,255,255,.95); filter: drop-shadow(0 1px 4px rgba(0,0,0,.6)); }
  .gal-thumb .gal-badge { position: absolute; left: 6px; bottom: 6px; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.78); color: #fff; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
  .gal-thumb .del { position: absolute; top: 6px; right: 6px; z-index: 3; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; cursor: pointer; line-height: 1; }
  .gal-thumb .del:hover { background: var(--red); }
  .gal-info { padding: 9px 11px 11px; }
  .gal-info .n { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.35; min-height: 2.7em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gal-info .m { margin-top: 3px; font-size: 11.5px; color: var(--muted); }

  #galleryStatus { color: var(--red); font-size: 13px; margin-bottom: 8px; }

  .fs-path { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 10px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
  .fs-path::-webkit-scrollbar { display: none; }

  .fs-crumb:hover { color: var(--primary); border-color: var(--primary); }

  .fs-list { display: flex; flex-direction: column; gap: 6px; }

  .fs-row.fs-dir { cursor: pointer; }

  .fs-ico { flex: 0 0 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 19px; background: var(--bg-soft); border: 1px solid var(--line); align-self: center; }
  .fs-cap { height: 5px; border-radius: 999px; background: var(--bg-soft); border: 1px solid var(--line); overflow: hidden; margin-top: 6px; }

  .fs-root:hover { border-color: var(--primary); }

  .btn-ghost:disabled { opacity: .45; cursor: default; }

  .fs-tools button:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

  #mmToast { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.72); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 700; pointer-events: none; }

  #mmSeekWrap { position: relative; height: 16px; display: flex; align-items: center; }

  #mmSeek { -webkit-appearance: none; appearance: none; position: relative; z-index: 2; width: 100%; height: 16px; margin: 0; background: transparent; }
  #mmSeek::-webkit-slider-runnable-track { height: 3px; border-radius: 999px; background: linear-gradient(to right, #f00 var(--fill, 0%), rgba(255,255,255,.25) var(--fill, 0%)); }
  #mmSeek::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #f00; border: 0; margin-top: -4.5px; }
  #mmCtrlRow { display: flex; align-items: center; gap: 8px; color: #fff; }
  #mmCtrlRow button { flex: 0 0 auto; width: 32px; height: 32px; border: 0; background: transparent; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .mm-vol { -webkit-appearance: none; appearance: none; width: 74px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.35); outline: none; flex: 0 0 auto; }
  .mm-vol::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 0; }
  #mmAutoBtn { font-size: 11px; font-weight: 700; letter-spacing: .3px; color: rgba(255,255,255,.6); }
  #mmAutoBtn.on { color: #f00; }
  #mmPlayer.mm-hide-cursor { cursor: none; }
  .mm-flex { flex: 1; }
  .hidden { display: none !important; }
  .cm-overlay { position: fixed; inset: 0; z-index: 90; background: rgba(8,12,22,.5); display: flex; align-items: center; justify-content: center; padding: 22px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .cm-box { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); }
  .cm-title { font-size: 16.5px; font-weight: 800; margin-bottom: 6px; }

  .cm-row .danger { background: var(--red); color: #fff; }

  .sheet-box { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -12px 32px rgba(0,0,0,.18); }
  .sheet:not(.hidden) { animation: sheetFade .18s ease; }

  @keyframes sheetFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheetUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .add-sheet { gap: 10px; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 84vh; overflow-y: auto; }
  .sheet-title { font-size: 13px; font-weight: 700; color: var(--muted); padding: 6px 8px 10px; word-break: break-word; }
  .sheet-list { display: flex; flex-direction: column; gap: 2px; }
  .sheet-list button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 13px 12px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font-size: 14.5px; font-weight: 600; text-align: left; cursor: pointer; }
  .sheet-list button:hover { background: var(--bg-soft); }
  .sheet-list button.danger { color: var(--red); }
  .sheet-cancel { width: 100%; margin-top: 8px; padding: 13px; border: 0; border-radius: 12px; background: var(--bg-soft); color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; }
  .share-qr { display: block; width: 190px; height: 190px; margin: 0 auto 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .fab { display: none; position: fixed; right: 18px; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); z-index: 55; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; font-size: 27px; font-weight: 600; box-shadow: 0 4px 14px rgba(67,83,230,.32); cursor: pointer; align-items: center; justify-content: center; transition: transform .15s ease, box-shadow .15s ease; }
  .fab:active { transform: scale(.92); }

  #filtersSticky .seg { margin-bottom: 0; }
  .status-card.offline .dot { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg); animation: dotBlink 1.1s ease-in-out infinite; }
  @keyframes dotBlink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  .empty .ico svg { width: 26px; height: 26px; color: var(--muted); }

  @keyframes skShimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .sk-list { display: flex; flex-direction: column; gap: 12px; }
  .sk-item { display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .sk-ico { flex: 0 0 42px; height: 42px; border-radius: 12px; }
  .sk-lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .sk-line { height: 12px; border-radius: 6px; }
  .sk-line.w60 { width: 60%; } .sk-line.w40 { width: 40%; } .sk-line.w80 { width: 80%; }
  .sk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px 14px; }
  .sk-cell { border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--line); }
  .sk-thumb { aspect-ratio: 16 / 9; border-radius: 0; }
  .sk-cap { margin: 9px 11px 11px; display: flex; flex-direction: column; gap: 6px; }
  .view-anim { animation: fadeSlide .26s ease; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes itemIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span>Tasirin Download Manager<small>Remote Control</small></span></div>
    <span id="speedTotal" class="speed-total hidden" title="Kecepatan download aktif">&#9889; 0 B/s <span class="st-sub"></span></span>
    <button id="newBtn" class="pill primary" type="button">+ New Download</button>
    <button id="galleryBtn" class="pill" type="button">Galeri</button>
    <button id="fsBtn" class="pill" type="button">File Manager</button>
    <button id="themeBtn" class="pill" type="button">&#127769;</button>
  </div>
</div>

<div id="connBanner" class="conn-banner hidden">
  <span id="connBannerText">Koneksi server terputus.</span>
  <button id="connReloadBtn" type="button">Muat Ulang</button>
</div>

<div class="wrap">
  <div class="status-card" id="deviceStatus">
    <span><span class="dot"></span>Menghubungkan ke device…</span>
  </div>

  <div class="toolbar hidden" id="downloadsToolbar">
    <button id="pauseAllBtn" type="button">&#9209; Jeda semua</button>
    <button id="resumeAllBtn" type="button">&#9654; Lanjut semua</button>
    <button id="retryFailedBtn" type="button">&#8635; Ulangi gagal</button>
    <button id="clearCompletedBtn" type="button">&#128465; Bersihkan selesai</button>
  </div>

  <div id="filtersSticky">
    <div class="seg" id="downloadsFilters">
      <button id="webFilterAll" type="button" class="on">Semua</button>
      <button id="webFilterActive" type="button">Aktif</button>
      <button id="webFilterCompleted" type="button">Selesai</button>
      <button id="webFilterFailed" type="button">Gagal</button>
    </div>
  </div>

  <div id="addSheet" class="sheet hidden">
    <form id="addForm" class="sheet-box add-sheet">
      <div class="sheet-title" id="addSheetTitle">Tambah Download</div>
      <input id="url" type="url" placeholder="URL file (https://…)" required>
      <input id="name" type="text" placeholder="Nama file (opsional)">
      <input id="checksum" type="text" placeholder="Checksum opsional (md5:/sha1:/sha256:)">
      <div class="grid2">
        <select id="speed">
          <option value="0">Kecepatan: global</option>
          <option value="128">128 KB/s</option>
          <option value="256">256 KB/s</option>
          <option value="512">512 KB/s</option>
          <option value="1024">1 MB/s</option>
          <option value="2048">2 MB/s</option>
          <option value="5120">5 MB/s</option>
        </select>
        <select id="priority">
          <option value="-1">Prioritas: Rendah</option>
          <option value="0" selected>Prioritas: Normal</option>
          <option value="1">Prioritas: Tinggi</option>
        </select>
      </div>
      <input id="storage" type="text" placeholder="Path folder tujuan di device (kosongkan = default)" value="">
      <div class="form-row">
        <button type="submit" class="btn-main">Tambah Download</button>
        <button id="cancelAdd" type="button" class="btn-ghost">Batal</button>
      </div>
    </form>
  </div>

  <div id="galleryView" class="hidden">
    <div class="gal-toolbar"><h2>Galeri Device</h2><span class="count" id="galleryCount"></span></div>
    <div class="gal-search"><input id="gallerySearch" type="search" placeholder="Cari foto/video…" autocomplete="off"></div>
    <div class="seg" id="galleryFilters">
      <button type="button" class="on" data-gal="all">Semua</button>
      <button type="button" data-gal="image">Foto</button>
      <button type="button" data-gal="video">Video</button>
    </div>
    <div id="galleryStatus"></div>
    <div id="galleryGrid" class="gal-grid"></div>
  </div>

  <div id="fsView" class="hidden">
  <div class="gal-toolbar">
    <h2>File Manager</h2>
    <span class="count" id="fsCount"></span>
    <button id="fsUpBtn" type="button" class="btn-ghost" style="margin-left:auto">Naik</button>
  </div>
  <div id="fsSticky" class="fs-sticky">
  <div id="fsPath" class="fs-path"></div>
  <div class="fs-tools" id="fsToolsRow">
    <span class="fs-loc-wrap">
      <select id="fsLocation" title="Pindah ke lokasi">
        <option value="">Lokasi&hellip;</option>
      </select>
    </span>
    <button id="fsMkdirBtn" type="button">Folder</button>
    <span class="fs-up-wrap">
      <button id="fsUploadBtn" type="button">Upload</button>
      <div id="fsUpMenu" class="hidden">
        <button type="button" data-up="file">Upload file&hellip;</button>
        <button type="button" data-up="dir">Upload folder&hellip;</button>
      </div>
    </span>
    <button id="fsSelectBtn" type="button">Pilih</button>
    <button id="fsDupesBtn" type="button">Duplikat</button>
  </div>
  </div>
  <input id="fsUploadFile" type="file" class="hidden" multiple>
  <input id="fsUploadDir" type="file" class="hidden" webkitdirectory multiple>
    <div id="fsBatch" class="fs-batch hidden">
      <span id="fsBatchCount"></span>
      <span id="fsBatchSize"></span>
      <button id="fsBatchAll" type="button">Pilih semua</button>
      <button id="fsBatchMove" type="button">Pindah</button>
      <button id="fsBatchDelete" type="button" class="danger">Hapus</button>
      <button id="fsBatchCancel" type="button">Batal</button>
    </div>
    <div id="fsStatus"></div>
    <div id="fsProgressBox" class="fs-upload hidden">
      <div class="fs-upload-head"><span id="fsProgressText"></span><span id="fsProgressPct"></span></div>
      <div class="bar"><div class="fill" id="fsProgressBar"></div></div>
      <div id="fsProgressList" class="fs-upload-list"></div>
    </div>
    <div id="fsList" class="fs-list"></div>
  </div>

  <div id="status"></div>
  <ul id="list" class="list"></ul>
  <div class="app-footer" id="appFooter"></div>
</div>

<button id="fabNewBtn" class="fab" type="button" title="Tambah download">+</button>

<div id="mediaModal">
  <div id="mmTop">
    <button id="mmBack" type="button" title="Tutup">&#10005;</button>
  </div>
  <div id="mmBody">
    <div id="mmPlayer" class="hidden">
      <video id="mmVideo" playsinline preload="metadata"></video>
      <div id="mmOverlayTitle" class="hidden"></div>
      <div id="mmBigPlay" class="mm-big hidden"><div class="icon"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div></div>
      <div id="mmSpinner" class="mm-spin hidden"></div>
      <div id="mmToast" class="hidden"></div>
      <div id="mmSeekTip" class="hidden"></div>
      <div id="mmCtrl" class="hidden">
        <div id="mmSeekWrap">
          <div id="mmBuf"></div>
          <input id="mmSeek" type="range" min="0" max="1000" value="0" step="1">
        </div>
        <div id="mmCtrlRow">
          <button id="mmPlayBtn" type="button"></button>
          <span id="mmTime">0:00 / 0:00</span>
          <span class="mm-flex"></span>
          <button id="mmSpeedBtn" type="button" title="Kecepatan putar">1&#215;</button>
          <button id="mmAutoBtn" type="button" title="Putar otomatis video berikutnya">AUTO</button>
          <button id="mmMuteBtn" type="button"></button>
          <input id="mmVol" class="mm-vol" type="range" min="0" max="100" value="100" title="Volume">
          <button id="mmFsBtn" type="button"></button>
        </div>
      </div>
    </div>
    <img id="mmImage" class="hidden">
    <div id="mmDesc" class="hidden">
      <div id="mmTitle"></div>
      <div id="mmSub"></div>
    </div>
    <div id="mmRelated" class="hidden"></div>
  </div>
</div>

<div id="fsSheet" class="sheet hidden">
  <div class="sheet-box">
    <div class="sheet-title" id="fsSheetTitle"></div>
    <div class="sheet-list" id="fsSheetList"></div>
    <button id="fsSheetCancel" type="button" class="sheet-cancel">Batal</button>
  </div>
</div>

<div id="fsDupesModal" class="sheet hidden">
  <div class="sheet-box">
    <div class="sheet-title" id="fsDupesTitle">Cari file duplikat</div>
    <div id="fsDupesBody" class="fs-dupes"></div>
    <div class="cm-row" style="margin-top:10px">
      <button id="fsDupesCancel" type="button" class="btn-ghost">Tutup</button>
      <button id="fsDupesDelete" type="button" class="danger" disabled>Hapus terpilih (0)</button>
    </div>
  </div>
</div>

<div id="itemSheet" class="sheet hidden">
  <div class="sheet-box">
    <div class="sheet-title" id="itemSheetTitle"></div>
    <div class="sheet-list" id="itemSheetList"></div>
    <button id="itemSheetCancel" type="button" class="sheet-cancel">Batal</button>
  </div>
</div>

<div id="confirmModal" class="cm-overlay hidden">
  <div class="cm-box">
    <div class="cm-title" id="confirmTitle">Hapus?</div>
    <div class="cm-text" id="confirmText"></div>
    <div class="cm-row">
      <button id="confirmNo" type="button" class="btn-ghost">Batal</button>
      <button id="confirmYes" type="button" class="danger">Hapus</button>
    </div>
  </div>
</div>

<div id="inputModal" class="cm-overlay hidden">
  <div class="cm-box">
    <div class="cm-title" id="inputTitle">Input</div>
    <input id="inputField" type="text" class="cm-input" autocomplete="off">
    <div class="cm-text" id="inputHint"></div>
    <div class="cm-row">
      <button id="inputNo" type="button" class="btn-ghost">Batal</button>
      <button id="inputYes" type="button" class="danger">OK</button>
    </div>
  </div>
</div>

function applyTheme(theme) {
  const resolved = (theme === 'dark' || (theme === 'auto' && systemDark())) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', resolved);
  const m = document.querySelector('meta[name="theme-color"]');

function mmFmtTime(t) {
  if (!isFinite(t) || t < 0) t = 0;
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const sec = Math.floor(t % 60);
  const mm = String(sec).padStart(2, '0');
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + mm : m + ':' + mm;
}

function mmShowToast(text) {

function vposKey(token) {
  return 'dm_vpos_' + token;
}

function saveVideoPos(token) {
  if (!token || mmType !== 'video') return;
  const d = mmVideo.duration || 0;
  const t = mmVideo.currentTime || 0;
  if (d <= 0) return;
  if (t < 5 || d - t < 10) {
    try { localStorage.removeItem(vposKey(token)); } catch (e) {}
    return;
  }
  try { localStorage.setItem(vposKey(token), JSON.stringify({ t: t, d: d })); } catch (e) {}
}

function loadVideoPos(token) {
  try {
    const raw = localStorage.getItem(vposKey(token));
    if (!raw) return 0;
    const o = JSON.parse(raw);
    return (o && typeof o.t === 'number' && o.t > 0) ? o.t : 0;
  } catch (e) { return 0; }
}

function mmSeekUI() {
  const d = mmVideo.duration || 0;
  const t = mmVideo.currentTime || 0;
  const pct = d ? (t / d) * 1000 : 0;
  mmSeek.value = Math.round(pct);
  mmSeek.style.setProperty('--fill', (pct / 10).toFixed(1) + '%');
  mmTime.textContent = mmFmtTime(t) + ' / ' + mmFmtTime(d);
}

function mmUpdateBuffer() {
  const d = mmVideo.duration || 0;
  if (!d || !mmVideo.buffered || !mmVideo.buffered.length) return;
  const end = mmVideo.buffered.end(mmVideo.buffered.length - 1);
  mmBuf.style.width = Math.min(100, (end / d) * 100).toFixed(1) + '%';
}

async function loadGallery(reset) {
  if (galleryLoading) return;
  galleryLoading = true;
  if (reset) showGallerySkeleton();
  try {
    const q = gallerySearch ? gallerySearch.value.trim() : '';
    const params = new URLSearchParams();
    params.set('page', reset ? 0 : galleryPage);
    if (q) params.set('q', q);
    if (galleryFilter && galleryFilter !== 'all') params.set('type', galleryFilter);
    const res = await fetch(API + '/api/gallery?' + params.toString());
    if (res.status === 401) {
      galleryStatus.textContent = 'PIN diperlukan. Muat ulang halaman untuk login.';
      if (gallerySentinel) { gallerySentinel.remove(); gallerySentinel = null; }
      galleryGrid.innerHTML = '';
      return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    galleryStatus.textContent = '';
    const items = data.items || [];
    if (reset) {
      galleryItems = items;
      galleryPage = 1;
      galleryLoaded = 0;
      if (gallerySentinel) { gallerySentinel.remove(); gallerySentinel = null; }
      galleryGrid.innerHTML = '';
      galleryCount.textContent = (data.total || items.length) + ' file';
      if (!items.length) {
        const filtered = galleryFilter !== 'all';
        galleryGrid.innerHTML = emptyHtml(
          'search',
          q ? 'Tidak ada hasil' : (filtered ? 'Tidak ada ' + (galleryFilter === 'video' ? 'video' : 'foto') : 'Belum ada foto/video'),
          q ? 'Coba kata kunci lain.' : (filtered ? 'Coba filter lain atau ubah kata kunci.' : 'File di folder download akan muncul di sini.')
        );
        galleryHasMore = false;
        galleryLoading = false;
        return;
      }
    } else {
      galleryItems = galleryItems.concat(items);
      galleryPage++;
    }
    galleryHasMore = !!data.hasMore;
    loadMoreGallery();
  } catch (e) {
    if (reset) {
      galleryStatus.textContent = 'Gagal memuat galeri: ' + e;
      if (gallerySentinel) { gallerySentinel.remove(); gallerySentinel = null; }
      galleryGrid.innerHTML = emptyHtml('warn', 'Gagal memuat galeri', String(e));
    }
  }
  galleryLoading = false;
}

function showGallerySkeleton() {
  galleryLoaded = 0;
  if (gallerySentinel) { gallerySentinel.remove(); gallerySentinel = null; }
  let html = '<div class="sk-grid">';
  for (let i = 0; i < 6; i++) {
    html += '<div class="sk-cell"><div class="sk-thumb skeleton"></div><div class="sk-cap">' +
      '<div class="sk-line w60 skeleton"></div><div class="sk-line w40 skeleton"></div></div></div>';
  }
  galleryGrid.innerHTML = html + '</div>';
}

function ensureGallerySentinel() {
  if (!gallerySentinel) {
    gallerySentinel = document.createElement('div');
    gallerySentinel.className = 'gal-sentinel';
    galleryGrid.appendChild(gallerySentinel);
  }
}

function loadMoreGallery() {
  if (galleryLoaded < galleryItems.length) {
    const next = galleryItems.slice(galleryLoaded, galleryLoaded + GALLERY_CHUNK);
    for (const it of next) renderGalleryCell(it);
    galleryLoaded += next.length;
  }
  if (galleryLoaded < galleryItems.length || galleryHasMore) {
    ensureGallerySentinel();
    if (galleryLoaded >= galleryItems.length) loadGallery(false);
  } else if (gallerySentinel) {
    gallerySentinel.remove();
    gallerySentinel = null;
  }
}

if (gallerySearch) {

    '</div>' +
    '<div class="gal-info">' +
      '<div class="n">' + escapeHtml(it.name) + '</div>' +
      '<div class="m">' + fmt(it.size) + (it.modified > 0 ? ' \u00b7 ' + fmtDate(it.modified) : '') + '</div>' +
    '</div>';
  cell.addEventListener('click', function () {
    openMedia(it, media);
  });
  cell.querySelector('.del').addEventListener('click', function (ev) {

  const route = currentRoute();

    const el = document.getElementById(id);
    if (el) el.classList.toggle('hidden', !showDownloads);
  });
  galleryView.classList.toggle('hidden', route !== 'gallery');

  fsBtn.textContent = route === 'files' ? 'Tutup file' : 'File Manager';
  document.getElementById('fabNewBtn').classList.toggle('hidden', route !== 'downloads');
  if (route === 'gallery') {
    restartAnim(galleryView);
    toggleAddForm(false);
    loadGallery(true);
  } else if (route === 'files') {
    restartAnim(fsView);
    toggleAddForm(false);
    fsSelectMode = false;
    fsSelected.length = 0;
    fsSelectBtn.textContent = 'Pilih';
    fsBatch.classList.add('hidden');
    loadFsLocations();
    loadFs();
  } else {
    restartAnim(document.getElementById('list'));
    if (pendingAddForm) {
      pendingAddForm = false;
      toggleAddForm(true);

function parentFsPath(p) {
  if (!p) return '';
  if (p.startsWith('m:')) {
    const rel = p.slice(2);
    const idx = rel.lastIndexOf('/');
    if (idx < 0) return '';
    return 'm:' + rel.slice(0, idx);
  }
  const idx = p.lastIndexOf('/');
  const up = idx > 0 ? p.slice(0, idx) : '';
  return (up === 'f:' || up === 'm:') ? '' : up;
}

function fsMsg(text, isErr) {
  fsStatus.textContent = text || '';
  fsStatus.style.color = isErr ? 'var(--red)' : 'var(--green)';
}

function fsCrumbParts(p) {
  if (!p) return [];
  const prefix = p.indexOf('m:') === 0 ? 'm:' : 'f:';
  const rel = p.slice(2).replace(/^\/+|\/+$/g, '');
  const segs = rel.split('/').filter(Boolean);
  const parts = [{label: '\u{1F4C1} Penyimpanan', path: ''}];
  let cur = prefix;
  segs.forEach(function (seg) {
    cur += (cur === 'm:' ? '' : '/') + seg;
    parts.push({label: seg, path: cur});
  });
  return parts;
}

function collapseCrumbs(parts) {
  if (parts.length <= 4) return parts;
  return [parts[0], {dots: true}, parts[parts.length - 2], parts[parts.length - 1]];
}

function renderFsCrumbs(p) {
  if (!p) {
    fsPathEl.textContent = 'Pilih lokasi penyimpanan';
    return;
  }
  const parts = collapseCrumbs(fsCrumbParts(p));
  fsPathEl.innerHTML = parts.map(function (part, i) {
    const last = i === parts.length - 1;
    if (part.dots) {
      return '<span class="fs-crumb-dots">\u2026</span>' + (last ? '' : '<span class="fs-crumb-sep">\u203A</span>');
    }
    const chip = '<span class="fs-crumb' + (last ? ' on' : '') + '" data-path="' + encodeURIComponent(part.path) + '">' + escapeHtml(part.label) + '</span>';
    return chip + (last ? '' : '<span class="fs-crumb-sep">\u203A</span>');
  }).join('');
  fsPathEl.querySelectorAll('.fs-crumb[data-path]').forEach(function (chip) {
    if (chip.classList.contains('on')) return;
    chip.addEventListener('click', function () {
      fsPath = decodeURIComponent(chip.dataset.path);
      loadFs();
    });
  });
}

async function loadFsLocations() {
  try {
    const res = await fetch(API + '/api/fs?path=');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    fsLocations = data.items || [];
    const cur = fsPath || '';
    fsLocation.innerHTML = '';
    const ph = document.createElement('option');
    ph.value = '';
    ph.textContent = 'Lokasi\u2026';
    fsLocation.appendChild(ph);
    fsLocations.forEach(function (r) {
      const o = document.createElement('option');
      o.value = r.path;
      o.textContent = r.name;
      fsLocation.appendChild(o);
    });
    const matched = fsLocations.some(function (r) { return r.path === cur; });
    if (cur && matched) fsLocation.value = cur;
  } catch (e) {
    fsLocation.innerHTML = '<option value="">Lokasi\u2026</option>';
  }
}

fsLocation.addEventListener('change', function () {
  const v = fsLocation.value;
  if (!v) return;
  fsPath = v;
  fsLocation.value = '';
  loadFs();
});

async function loadFs() {
  showFsSkeleton();
  try {
    const res = await fetch(API + '/api/fs?path=' + encodeURIComponent(fsPath));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    fsStatus.textContent = '';
    renderFsCrumbs(fsPath);
    fsUpBtn.disabled = !fsPath;
    fsToolsRow.classList.toggle('hidden', !fsPath);
    fsSelectBtn.classList.toggle('hidden', !fsPath);
    fsItems = data.items || [];
    fsCount.textContent = fsItems.length ? fsItems.length + ' item' : '';
    if (!fsPath) loadFsLocations();
    renderFs(fsItems);
  } catch (e) {
    fsMsg('Gagal memuat: ' + e, true);
    fsList.innerHTML = emptyHtml('warn', 'Gagal memuat folder', String(e));
  }
}

function showFsSkeleton() {
  let html = '<div class="sk-list">';
  for (let i = 0; i < 4; i++) {
    html += '<div class="sk-item"><div class="sk-ico skeleton"></div><div class="sk-lines">' +
      '<div class="sk-line w60 skeleton"></div><div class="sk-line w40 skeleton"></div></div></div>';
  }
  fsList.innerHTML = html + '</div>';
}

function fsIconFor(it) {
  if (it.kind === 'dir') return '\u{1F4C1}';
  const ext = extOf(it.name).toLowerCase();
  if (FS_MEDIA_EXTS.indexOf(ext) >= 0) {
    if (['jpg','jpeg','png','gif','webp','bmp','svg','heic'].indexOf(ext) >= 0) return '\u{1F5BC}\uFE0F';
    if (['mp3','m4a','aac','wav','ogg','flac'].indexOf(ext) >= 0) return '\u{1F3B5}';
    return '\u{1F3AC}';
  }
  if (['zip','rar','7z','tar','gz','bz2','xz'].indexOf(ext) >= 0) return '\u{1F4E6}';
  if (ext === 'apk') return '\u{1F916}';
  if (ext === 'pdf') return '\u{1F4C4}';
  if (['txt','md','log','csv','json','xml','html','css','js','kt','java','py','sh','sql'].indexOf(ext) >= 0) return '\u{1F4DC}';
  if (['doc','docx','xls','xlsx','ppt','pptx','odt','rtf'].indexOf(ext) >= 0) return '\u{1F4DD}';
  return '\u{1F4C4}';
}

function fsQuickBtn(it) {
  const url = it.kind === 'dir'
    ? API + '/api/fs_zip?path=' + encodeURIComponent(it.path)
    : API + '/api/media?token=' + encodeURIComponent(it.token) + '&dl=1';
  return '<button class="item-menu-btn fs-q-btn" type="button" title="Unduh" data-url="' + url.replace(/&/g, '&amp;') + '">\u2B07</button>';
}

function fsRootIcon(r) {
  const p = String(r.path || '').toLowerCase();
  const n = String(r.name || '').toLowerCase();
  if (n.indexOf('usb') >= 0 || p.indexOf('usb') >= 0) return '\u{1F50C}';
  if (/\/[0-9a-f]{4}-[0-9a-f]{4}/.test(p) || n.indexOf('sd') >= 0 || n.indexOf('kartu') >= 0) return '\u{1F4BE}';
  if (p.indexOf('emulated') >= 0 || p.indexOf('sdcard') >= 0) return '\u{1F4F1}';
  return '\u{1F4BD}';
}

function fsRootCap(r) {
  if (!r.totalBytes || r.totalBytes <= 0) return '';
  const used = Math.max(0, (r.totalBytes || 0) - (r.freeBytes || 0));
  const pct = Math.min(100, Math.round(used * 100 / r.totalBytes));
  return '<div class="fs-cap"><div class="fill" style="width:' + pct + '%"></div></div>' +
    '<small class="fs-cap-txt">' + fmt(used) + ' terpakai \u00b7 ' + fmt(r.totalBytes) + '</small>';
}

function renderFs(items) {
  const box = fsList;
  box.innerHTML = '';
  if (!fsPath) {
    if (!items.length) {
      box.innerHTML = emptyHtml('storage', 'Tidak ada penyimpanan tersedia', '');
      return;
    }
    for (const r of items) {
      const row = document.createElement('div');
      row.className = 'fs-root';
      row.setAttribute('tabindex', '0');
      row.innerHTML = '<span class="fs-ico">' + fsRootIcon(r) + '</span>' +
        '<div class="fs-main"><div class="fs-name">' + escapeHtml(r.name) + '</div>' +
        '<div class="fs-rcap"><small>' + escapeHtml(r.path) + '</small>' + fsRootCap(r) + '</div></div>';
      row.addEventListener('click', function () {
        fsPath = r.path;
        loadFs();
      });
      box.appendChild(row);
    }
    return;
  }
  if (!items.length) {
    box.innerHTML = emptyHtml('folder', 'Folder kosong', 'Tidak ada file di folder ini.');
    const cta = document.createElement('div');
    cta.className = 'empty-cta';
    const up = document.createElement('button');
    up.type = 'button';
    up.className = 'pill primary';
    up.textContent = 'Upload';
    up.addEventListener('click', function () { document.getElementById('fsUploadFile').click(); });
    const mk = document.createElement('button');
    mk.type = 'button';
    mk.className = 'pill';
    mk.textContent = 'Buat Folder';
    mk.addEventListener('click', function () { document.getElementById('fsMkdirBtn').click(); });
    cta.appendChild(up);
    cta.appendChild(mk);
    box.appendChild(cta);
    return;
  }
  for (const it of items) {
    const row = document.createElement('div');
    row.className = 'fs-row';
    row.setAttribute('tabindex', '0');
    if (it.kind === 'dir') row.classList.add('fs-dir');
    let meta = '';
    if (it.kind === 'file') {
      meta = fmt(it.size);
      if (it.modified > 0) meta += ' \u00b7 ' + fmtDate(it.modified);
    } else if (it.itemCount >= 0) {
      meta = it.itemCount + ' item';
      if (it.totalSize > 0) meta += ' \u00b7 ' + fmt(it.totalSize);
    }
    const selIdx = fsSelected.indexOf(it);
    const check = fsSelectMode
      ? '<span class="fs-check' + (selIdx >= 0 ? ' on' : '') + '">' + (selIdx >= 0 ? '\u2713' : '') + '</span>'
      : '';
    row.innerHTML =
      check +
      '<span class="fs-ico">' + fsIconFor(it) + '</span>' +
      '<div class="fs-main"><div class="fs-name">' + escapeHtml(it.name) + '</div>' +
      (meta ? '<div class="fs-meta">' + meta + '</div>' : '') + '</div>' +
      (!fsSelectMode ? fsQuickBtn(it) + '<button class="fs-more-btn" type="button" title="Aksi">\u22EF</button>' : '');
    row.addEventListener('click', function () {
      if (fsLpFired) { fsLpFired = false; return; }
      if (fsSelectMode) {
        toggleFsSelect(it, row);
      } else if (it.kind === 'dir') {
        fsPath = it.path;
        loadFs();
      } else if (FS_MEDIA_EXTS.indexOf(extOf(it.name).toLowerCase()) >= 0) {
        fsOpenMedia(it);
      }
    });
    attachFsLongPress(row, it);
    const moreBtn = row.querySelector('.fs-more-btn');
    if (moreBtn) {
      moreBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        openFsSheet(it);
      });
    }
    const qBtn = row.querySelector('.fs-q-btn');
    if (qBtn) {
      qBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        fsDownloadUrl(qBtn.dataset.url);
      });
    }
    box.appendChild(row);
  }
}

function attachFsLongPress(row, it) {
  const start = function (ev) {
    if (fsSelectMode || ev.target.closest('button,a')) return;
    fsLpFired = false;
    clearTimeout(fsLpTimer);
    fsLpTimer = setTimeout(function () {
      fsLpFired = true;
      fsSelectMode = true;
      fsSelectBtn.textContent = 'Batal pilih';
      fsSelected.length = 0;
      fsSelected.push(it);
      renderFs(fsItems);
      updateFsBatch();
    }, 480);
  };
  const end = function () { clearTimeout(fsLpTimer); };
  row.addEventListener('touchstart', start, {passive: true});
  row.addEventListener('touchend', end);
  row.addEventListener('touchmove', end);
  row.addEventListener('touchcancel', end);
  row.addEventListener('mousedown', start);
  row.addEventListener('mouseup', end);
  row.addEventListener('mouseleave', end);
}

function toggleFsSelect(it, row) {
  const idx = fsSelected.indexOf(it);
  if (idx >= 0) {
    fsSelected.splice(idx, 1);
  } else {
    fsSelected.push(it);
  }
  const check = row.querySelector('.fs-check');
  check.classList.toggle('on', fsSelected.indexOf(it) >= 0);
  check.textContent = fsSelected.indexOf(it) >= 0 ? '\u2713' : '';
  updateFsBatch();
}

function updateFsBatch() {
  fsBatch.classList.toggle('hidden', fsSelected.length === 0);
  document.getElementById('fsBatchCount').textContent = fsSelected.length + ' dipilih';
  let total = 0;
  fsSelected.forEach(function (it) {
    total += (it.kind === 'file' ? it.size : (it.totalSize || 0)) || 0;
  });
  document.getElementById('fsBatchSize').textContent = total > 0 ? '\u00b7 ' + fmt(total) : '';
  document.getElementById('fsBatchAll').textContent = (fsItems || []).length > 0 && fsSelected.length === fsItems.length ? 'Batalkan semua' : 'Pilih semua';
}

fsSelectBtn.addEventListener('click', function () {
  if (!fsPath) return;
  fsSelectMode = !fsSelectMode;
  fsSelected.length = 0;
  fsSelectBtn.textContent = fsSelectMode ? 'Batal pilih' : 'Pilih';
  fsBatch.classList.add('hidden');
  loadFs();
});

document.getElementById('fsBatchDelete').addEventListener('click', function () {
  if (!fsSelected.length) return;
  showConfirm('Hapus ' + fsSelected.length + ' item?', 'Folder dihapus beserta isinya.', 'Hapus', function () {
    (async function () {
      for (const it of fsSelected) {
        await postFsAction({action: 'delete', path: it.path});
      }
      fsSelected.length = 0;
      loadFs();
    })();
  });
});

document.getElementById('fsBatchMove').addEventListener('click', function () {
  if (!fsSelected.length) return;
  showInput('Pindah', fsPath, 'Path folder tujuan di device\nContoh: f:/storage/emulated/0/Download/sub\natau: m:Download/sub', 'Pindah', function (dest) {
    if (!dest) return;
    (async function () {
      for (const it of fsSelected) {
        await postFsAction({action: 'move', path: it.path, dest: dest});
      }
      fsSelected.length = 0;
      loadFs();
    })();
  });
});

document.getElementById('fsBatchCancel').addEventListener('click', function () {
  fsSelectMode = false;
  fsSelected.length = 0;
  fsSelectBtn.textContent = 'Pilih';
  fsBatch.classList.add('hidden');
  loadFs();
});

document.getElementById('fsBatchAll').addEventListener('click', function () {
  const all = fsItems || [];
  const allSel = all.length > 0 && fsSelected.length === all.length;
  fsSelected.length = 0;
  if (!allSel) {
    for (let i = 0; i < all.length; i++) fsSelected.push(all[i]);
  }
  fsList.querySelectorAll('.fs-row .fs-check').forEach(function (c) {
    c.classList.toggle('on', !allSel);
    c.textContent = !allSel ? '\u2713' : '';
  });
  updateFsBatch();
});

const fsSheet = document.getElementById('fsSheet');
function fsDownloadUrl(url) {
  const a = document.createElement('a');
  a.href = url;
  a.download = '';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { a.remove(); }, 1000);
}
function openFsSheet(it) {
  document.getElementById('fsSheetTitle').textContent = it.name;
  const list = document.getElementById('fsSheetList');
  list.innerHTML = '';
  const acts = [];
  if (it.kind === 'file') {
    const media = API + '/api/media?token=' + encodeURIComponent(it.token);
    acts.push({label: '\u25B6 Stream', stream: media});
    acts.push({label: '\u2B07 Download', dl: media + '&dl=1'});
  } else {
    acts.push({label: '\u{1F4E6} Download folder (ZIP)', dl: API + '/api/fs_zip?path=' + encodeURIComponent(it.path)});
  }
  acts.push({label: '\u270E Rename', op: 'rename'});
  acts.push({label: '\u27A1 Pindah', op: 'move'});
  acts.push({label: '\u{1F5D1} Hapus', op: 'delete', danger: true});
  acts.forEach(function (a) {
    const b = document.createElement('button');
    b.type = 'button';
    if (a.danger) b.className = 'danger';
    b.textContent = a.label;
    b.addEventListener('click', function () {
      closeFsSheet();
      if (a.stream) { window.open(a.stream, '_blank'); return; }
      if (a.dl) { fsDownloadUrl(a.dl); return; }
      doFsOp(it, a.op);
    });
    list.appendChild(b);
  });
  fsSheet.classList.remove('hidden');
}
function closeFsSheet() {
  fsSheet.classList.add('hidden');
}
document.getElementById('fsSheetCancel').addEventListener('click', closeFsSheet);
fsSheet.addEventListener('click', function (e) {
  if (e.target === fsSheet) closeFsSheet();
});

const itemSheet = document.getElementById('itemSheet');
function openItemSheet(it) {
  document.getElementById('itemSheetTitle').textContent = it.fileName;
  const list = document.getElementById('itemSheetList');
  list.innerHTML = '';
  const encId = encodeURIComponent(it.id);
  const acts = [];
  if (it.state === 'COMPLETED') {
    acts.push({label: '\u25B6 Stream', stream: API + '/file/' + encId});
    acts.push({label: '\u2B07 Download', dl: API + '/file/' + encId + '?dl=1'});
    acts.push({label: '\u{1F517} Bagikan', op: 'share'});
    acts.push({label: '\u270F Ubah nama', op: 'rename'});
  }
  if (it.state === 'DOWNLOADING') acts.push({label: '\u23F8 Jeda', op: 'pause'});
  if (it.state === 'PAUSED' || it.state === 'FAILED') acts.push({label: '\u25B6 Lanjut', op: 'resume'});
  if (it.state === 'PENDING' || it.state === 'PAUSED' || it.state === 'FAILED') {
    acts.push({label: '\u23F1 Batas kecepatan', op: 'limit'});
  }
  if (it.state === 'DOWNLOADING' || it.state === 'PENDING' || it.state === 'PAUSED') {
    acts.push({label: '\u2715 Batal', op: 'cancel'});
  }
  if (it.state === 'COMPLETED' || it.state === 'FAILED' || it.state === 'CANCELLED') {
    acts.push({label: '\u{1F5D1} Hapus', op: 'delete', danger: true});
  }
  acts.forEach(function (a) {
    const b = document.createElement('button');
    b.type = 'button';
    if (a.danger) b.className = 'danger';
    b.textContent = a.label;
    b.addEventListener('click', function () {
      closeItemSheet();
      if (a.stream) { window.open(a.stream, '_blank'); return; }
      if (a.dl) { fsDownloadUrl(a.dl); return; }
      if (a.op === 'rename') {
        showInput('Ubah nama', it.fileName, 'Nama baru untuk file ini', 'Simpan', function (name) {
          if (!name || name === it.fileName) return;
          doActionNow(it.id, 'rename', {name: name});
        });
        return;
      }
      if (a.op === 'limit') {
        showInput(
          'Batas kecepatan',
          String(it.speedLimitKbps || 0),
          'KB/s (0 = tanpa batas). Opsional prioritas -1/0/1 di belakang, contoh: 512 1',
          'Simpan',
          function (val) {
            const parts = val.trim().split(/\s+/);
            const speed = parseInt(parts[0], 10);
            if (isNaN(speed) || speed < 0) return;
            const priority = parts.length > 1 ? parseInt(parts[1], 10) : 0;
            doActionNow(it.id, 'limit_priority', {
              speedLimitKbps: speed,
              priority: isNaN(priority) ? 0 : priority
            });
          }
        );
        return;
      }
      doAction(it.id, a.op);
    });
    list.appendChild(b);
  });
  itemSheet.classList.remove('hidden');
}
function closeItemSheet() {
  itemSheet.classList.add('hidden');
}
document.getElementById('itemSheetCancel').addEventListener('click', closeItemSheet);
itemSheet.addEventListener('click', function (e) {
  if (e.target === itemSheet) closeItemSheet();
});

function fsOpenMedia(it) {
  const token = encodeURIComponent(it.token);
  const media = API + '/api/media?token=' + token;
  const isVideo = ['mp4','mkv','webm','avi','mov','3gp','m4v','mpg','mpeg'].indexOf(extOf(it.name).toLowerCase()) >= 0;
  openMedia(
    {name: it.name, size: it.size, modified: it.modified, token: it.token, isVideo: isVideo},
    media
  );
}

async function doFsOp(it, op) {
  if (op === 'delete') {
    showConfirm('Hapus ' + (it.kind === 'dir' ? 'folder' : 'file') + '?',
      'Hapus \"' + it.name + '\" dari device? Folder dihapus beserta isinya.',
      'Hapus',
      function () {
        postFsAction({action: 'delete', path: it.path}).then(loadFs);
      });
  } else if (op === 'rename') {
    showInput('Rename', it.name, 'Nama baru untuk \"' + it.name + '\"', 'Rename',
      function (name) {
        if (!name) return;
        postFsAction({action: 'rename', path: it.path, name: name}).then(loadFs);
      });
  } else if (op === 'move') {
    showInput('Pindah', fsPath, 'Path folder tujuan di device\nContoh: f:/storage/emulated/0/Download/sub\natau: m:Download/sub', 'Pindah',
      function (dest) {
        if (!dest) return;
        postFsAction({action: 'move', path: it.path, dest: dest}).then(loadFs);
      });
  }
}

async function postFsAction(params) {
  const body = new URLSearchParams();
  Object.entries(params).forEach(function (e) { body.append(e[0], e[1]); });
  const res = await fetch(API + '/api/fs_action', {method: 'POST', body});
  const data = await res.json();
  if (!data.ok) fsMsg('Operasi gagal', true);
}

document.getElementById('fsMkdirBtn').addEventListener('click', async function () {
  if (!fsPath) {
    fsMsg('Buka folder tujuan dulu', true);
    return;
  }
  if (fsPath.startsWith('m:')) {
    fsMsg('MediaStore: folder tidak bisa dibuat manual', true);
    return;
  }
  showInput('Buat folder baru', 'Folder Baru', 'Nama folder baru di: ' + fsPath, 'Buat', function (name) {
    if (!name) return;
    postFsAction({action: 'mkdir', path: fsPath, name: name}).then(loadFs);
  });
});

const UPLOAD_CHUNK = 2 * 1024 * 1024;

let fsUploading = false;

function uploadFiles(files, path, statusEl, progressBox, progressText, progressPct, progressBar, done, listEl) {
  fsUploading = true;
  const jobs = Array.from(files).map(function (f) {
    const j = (f && f.file) ? f : { file: f, path: path };
    j.id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    return j;
  });
  const total = jobs.length;
  if (!total) return;
  const failed = [];
  if (listEl) {
    listEl.innerHTML = '';
    jobs.forEach(function (j) {
      const div = document.createElement('div');
      div.className = 'fs-ul-row';
      div.id = 'ul-' + j.id;
      div.innerHTML = '<span class="st">\u23F3</span><span class="nm"></span><span class="sz"></span>';
      div.querySelector('.nm').textContent = j.file.name;
      div.querySelector('.sz').textContent = fmt(j.file.size);
      listEl.appendChild(div);
    });
  }
  function ulSet(id, status, cls) {
    if (!listEl) return;
    const row = document.getElementById('ul-' + id);
    if (!row) return;
    const st = row.querySelector('.st');
    st.textContent = status;
    row.classList.remove('ok', 'err', 'run');
    if (cls) row.classList.add(cls);
  }
  function ulFail(id) { ulSet(id, '\u2717', 'err'); }
  function ulOk(id) { ulSet(id, '\u2713', 'ok'); }
  let idx = 0;
  let sentBytes = 0;
  let totalBytes = 0;
  for (const j of jobs) totalBytes += j.file.size;
  let bestDone = 0;
  let speed = 0;
  progressBox.classList.remove('hidden');

  function uploadOne(job, attempt) {
    const file = job.file;
    ulSet(job.id, '\u2191', 'run');
    const target = job.path;
    statusEl.style.color = '';
    statusEl.textContent = 'Mengunggah ' + file.name + ' (' + (idx + 1) + '/' + total + ')' +
      (attempt > 1 ? ' \u00b7 coba ke-' + attempt : '') + ' \u2026';
    progressText.textContent = file.name + (attempt > 1 ? ' (coba ' + attempt + ')' : '');
    const id = job.id;
    const chunks = Math.max(1, Math.ceil(file.size / UPLOAD_CHUNK));
    let chunkIdx = 0;
    let chunkFails = 0;
    let lastErr = '';
    let chunkBest = 0;
    let lastBytes = 0;
    let lastTime = 0;

    function nextChunk() {
      if (chunkIdx >= chunks) {
        sentBytes += file.size;
        ulOk(job.id);
        finishOne();
        return;
      }
      const start = chunkIdx * UPLOAD_CHUNK;
      const end = Math.min(start + UPLOAD_CHUNK, file.size);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', API + '/api/upload?name=' + encodeURIComponent(file.name) +
        '&path=' + encodeURIComponent(target) +
        '&id=' + encodeURIComponent(id) +
        '&chunk=' + chunkIdx + '&chunks=' + chunks +
        '&offset=' + start);

      xhr.timeout = 120000;
      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;

        if (e.loaded < chunkBest) return;
        chunkBest = e.loaded;
        if (lastTime === 0) { lastTime = Date.now(); lastBytes = e.loaded; }
        const dt = (Date.now() - lastTime) / 1000;
        if (dt >= 0.5) {
          const s = (e.loaded - lastBytes) / dt;
          if (s >= 0) speed = s;
          lastBytes = e.loaded;
          lastTime = Date.now();
        }
        const doneNow = sentBytes + start + chunkBest;
        if (doneNow > bestDone) bestDone = doneNow;
        const pct = totalBytes > 0 ? Math.round(bestDone * 100 / totalBytes) : 0;
        progressBar.style.width = pct + '%';
        const etaSec = speed > 0 && totalBytes > bestDone
          ? Math.round((totalBytes - bestDone) / speed) : 0;
        progressPct.textContent = pct + '% \u00b7 ' + fmtSpeed(speed) +
          (etaSec > 0 ? ' \u00b7 sisa ~' + fmtEta(etaSec) : '');
        ulSet(job.id, Math.min(99, Math.round((start + chunkBest) * 100 / file.size)) + '%', 'run');
      };
      xhr.onload = function () {
        let ok = false;
        let pending = false;
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            const d = JSON.parse(xhr.responseText);
            ok = !!d.ok;
            pending = !!d.pending;
          } catch (e) {}
        }
        if (pending) {

          pollFinalize();
        } else if (ok) {
          chunkIdx++;
          chunkFails = 0;
          chunkBest = 0;
          lastBytes = 0;
          lastTime = 0;
          nextChunk();
        } else {
          try { lastErr = (xhr.responseText ? JSON.parse(xhr.responseText).error : '') || ''; } catch (e) {}
          retryChunk();
        }
      };
      xhr.onerror = function () { lastErr = 'koneksi terputus'; retryChunk(); };
      xhr.onabort = function () { lastErr = 'permintaan dibatalkan'; retryChunk(); };
      xhr.ontimeout = function () {
        lastErr = 'waktu habis, koneksi macet (akan dicoba lagi)';
        retryChunk();
      };
      xhr.send(file.slice(start, end));
    }

    function pollFinalize() {
      statusEl.textContent = 'Menyelesaikan ' + file.name + ' \u2026';
      let tries = 0;
      (function tick() {
        const v = new XMLHttpRequest();
        v.open('GET', API + '/api/upload_verify?id=' + encodeURIComponent(id));
        v.timeout = 6000;
        v.onload = function () {
          let done = false;
          let err = '';
          let name = '';
          try {
            const d = JSON.parse(v.responseText);
            done = !!d.ok;
            err = d.error || '';
            name = d.name || '';
          } catch (e) {}
          tries++;
          if (done) {
            sentBytes += file.size;
            statusEl.textContent = 'Selesai: ' + (name || file.name);
            ulOk(job.id);
            finishOne();
          } else if (err) {
            failed.push(file.name);
          ulFail(job.id);
            statusEl.textContent = 'Gagal: ' + file.name + ' \u2014 ' + err;
            finishOne();
          } else if (tries < 200) {
            setTimeout(tick, 1500);
          } else {
            failed.push(file.name);
          ulFail(job.id);
            statusEl.textContent = 'Gagal: ' + file.name + ' \u2014 penyelesaian terlalu lama';
            finishOne();
          }
        };
        v.onerror = v.ontimeout = function () {
          tries++;
          if (tries < 200) {
            setTimeout(tick, 1500);
          } else {
            failed.push(file.name);
          ulFail(job.id);
            statusEl.textContent = 'Gagal: ' + file.name + ' \u2014 penyelesaian terlalu lama';
            finishOne();
          }
        };
        v.send();
      })();
    }

    function retryChunk() {
      chunkFails++;
      if (chunkFails < 3) {
        setTimeout(nextChunk, 600);
        return;
      }
      if (attempt < 3) {
        setTimeout(function () { uploadOne(job, attempt + 1); }, 800);
        return;
      }

      const verify = new XMLHttpRequest();
      verify.open('GET', API + '/api/upload_verify?id=' + encodeURIComponent(id));
      verify.timeout = 5000;
      verify.onload = function () {
        let done = false;
        let pending = false;
        let err = '';
        let name = '';
        try {
          const d = JSON.parse(verify.responseText);
          done = !!d.ok;
          pending = !!d.pending;
          err = d.error || '';
          name = d.name || '';
        } catch (e) {}
        if (done) {
          sentBytes += file.size;
          statusEl.textContent = 'Selesai: ' + (name || file.name);
          ulOk(job.id);
          finishOne();
        } else if (pending) {
          pollFinalize();
        } else if (err) {
          failed.push(file.name);
          ulFail(job.id);
          statusEl.textContent = 'Gagal: ' + file.name + ' \u2014 ' + err;
          finishOne();
        } else {
          failed.push(file.name);
          ulFail(job.id);
          statusEl.textContent = 'Gagal: ' + file.name + (lastErr ? ' \u2014 ' + lastErr : '');
          finishOne();
        }
      };
      verify.onerror = verify.ontimeout = function () {
        failed.push(file.name);
          ulFail(job.id);
        statusEl.textContent = 'Gagal: ' + file.name + (lastErr ? ' \u2014 ' + lastErr : '');
        finishOne();
      };
      verify.send();
    }

    nextChunk();
  }

  function finishOne() {
    idx++;
    if (idx >= total) {
      progressBox.classList.add('hidden');
      fsUploading = false;
      if (done) done(failed.length === 0, failed);
      return;
    }
    uploadOne(jobs[idx], 1);
  }

  uploadOne(jobs[0], 1);
}

    return { file: f, path: sub ? (fsPath ? fsPath + '/' + sub : sub) : fsPath };
  });
}

  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const d = mmVideo.duration || 0;
  switch (e.code) {
    case 'Space': e.preventDefault(); mmTogglePlay(); break;
    case 'ArrowLeft': e.preventDefault(); mmSeekBy(-5); break;
    case 'ArrowRight': e.preventDefault(); mmSeekBy(5); break;
    case 'ArrowUp': e.preventDefault(); mmVolBy(0.1); break;
    case 'ArrowDown': e.preventDefault(); mmVolBy(-0.1); break;
    case 'KeyJ': mmSeekBy(-10); break;
    case 'KeyL': mmSeekBy(10); break;
    case 'KeyM': mmMuteBtn.click(); break;
    case 'KeyF': mmFsBtn.click(); break;
    case 'Home': e.preventDefault(); mmSeekTo(0); break;
    case 'End': e.preventDefault(); if (d) mmSeekTo(d); break;
  }

function mmLockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      const p = screen.orientation.lock('landscape');
      if (p && p.catch) p.catch(function () {});
    } else if (screen.lockOrientation) {
      screen.lockOrientation('landscape');
    }
  } catch (e) {}
}
function mmUnlockOrientation() {
  try {
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    else if (screen.unlockOrientation) screen.unlockOrientation();
  } catch (e) {}
}

    mmUnlockOrientation();
    if (exit) exit.call(document);

    const p = req.call(el);
    if (p && p.then) {
      p.then(function () { mmLockLandscape(); }).catch(function () {});

});

  mmLastTapX = e.clientX;
  if (dt < 350 && Math.abs(e.clientX - prevX) < 80) {
    clearTimeout(mmTapTimer);
    if (e.pointerType === 'mouse') {

      mmFsBtn.click();
      return;
    }
    if (!mmVideo.paused && !mmEnded) {
      const d = mmVideo.duration || 0;
      if (d) {
        const delta = e.clientX < window.innerWidth / 2 ? -10 : 10;
        mmVideo.currentTime = Math.min(Math.max(mmVideo.currentTime + delta, 0), d);
        mmShowToast((delta > 0 ? '+10' : '-10') + ' dtk');
        mmSeekUI();
      }
      mmShowCtrl();
    }
    return;
  }
  if (mmVideo.paused) {
    if (mmEnded) {
      mmEnded = false;
      mmVideo.currentTime = 0;
      mmBigPlay.innerHTML = '<div class="icon">' + ICONS.play + '</div>';
    }
    mmVideo.play();
    mmShowCtrl();
  } else {
    clearTimeout(mmTapTimer);
    mmTapTimer = setTimeout(function () {
      mmVideo.pause();
      mmShowCtrl();
    }, 220);
  }
});

function mmCurBrightness() {

mmPlayer.addEventListener('touchstart', function (e) {
  if (e.touches.length !== 1) { mmGesture = null; return; }
  const left = e.touches[0].clientX < window.innerWidth / 2;
  mmGesture = {
    side: left ? 'b' : 'v',
    startY: e.touches[0].clientY,
    startVal: left ? mmCurBrightness() : mmVideo.volume,
    active: false
  };
}, { passive: true });
mmPlayer.addEventListener('touchmove', function (e) {
  if (!mmGesture || e.touches.length !== 1) return;
  const dy = e.touches[0].clientY - mmGesture.startY;
  if (!mmGesture.active && Math.abs(dy) < 12) return;
  mmGesture.active = true;
  e.preventDefault();
  const delta = -dy / (window.innerHeight * 0.6);
  const val = Math.min(1, Math.max(0, mmGesture.startVal + delta));
  if (mmGesture.side === 'b') {
    mmSetBrightness(val);
    mmShowToast('\u{1F506} ' + Math.round(val * 100) + '%');
  } else {
    mmVideo.volume = val;

function fmt(bytes) {
  if (bytes < 1024) return bytes + ' B';
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB';
  const mb = kb / 1024;
  if (mb < 1024) return mb.toFixed(1) + ' MB';
  return (mb / 1024).toFixed(2) + ' GB';
}

function fmtSpeed(bps) {
  if (bps < 1024) return bps + ' B/s';
  const kb = bps / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB/s';
  return (kb / 1024).toFixed(2) + ' MB/s';
}

function fmtEta(seconds) {
  if (seconds <= 0) return '0s';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return h + 'j ' + String(m).padStart(2, '0') + 'm';
  if (m > 0) return m + 'm ' + String(s).padStart(2, '0') + 's';
  return s + 's';
}

function stateLabel(s) {
  return {PENDING:'Menunggu', DOWNLOADING:'Mendownload', PAUSED:'Dijeda', COMPLETED:'Selesai', FAILED:'Gagal', CANCELLED:'Dibatalkan'}[s] || s;
}

function stateBadge(s) {
  const map = {PENDING:'b-paused', DOWNLOADING:'b-active', PAUSED:'b-paused', COMPLETED:'b-done', FAILED:'b-fail', CANCELLED:'b-fail'};
  return '<span class="badge ' + (map[s] || 'b-paused') + '">' + stateLabel(s) + '</span>';
}

function fileIcon(name) {
  const e = extOf(name).toLowerCase();
  if (['mp4','mkv','webm','avi','mov','3gp','m4v'].indexOf(e) >= 0) return '\u{1F3AC}';
  if (['jpg','jpeg','png','gif','webp','bmp'].indexOf(e) >= 0) return '\u{1F5BC}';
  if (['mp3','m4a','aac','wav','ogg','flac'].indexOf(e) >= 0) return '\u{1F3B5}';
  if (e === 'apk') return '\u{1F4E6}';
  if (e === 'pdf') return '\u{1F4C4}';
  if (['zip','rar','7z','tar','gz','xz'].indexOf(e) >= 0) return '\u{1F4E6}';
  if (['txt','md','log','csv'].indexOf(e) >= 0) return '\u{1F4C4}';
  return '\u{1F4CE}';
}

function renderSpeedTotal(items) {
  const el = document.getElementById('speedTotal');
  if (!el) return;
  let total = 0;
  let active = 0;
  items.forEach(function (it) {
    if (it.state === 'DOWNLOADING') {
      active++;
      if (it.speedBps > 0) total += it.speedBps;
    } else if (it.state === 'PENDING') {
      active++;
    }
  });
  if (!active) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML = '&#9889; ' + fmtSpeed(total) + ' <span class="st-sub">' + active + ' aktif</span>';
}

function updateToolbar(items) {
  let active = 0;
  let pausedOrFailed = 0;
  let failed = 0;
  let completed = 0;
  items.forEach(function (it) {
    if (it.state === 'DOWNLOADING' || it.state === 'PENDING') active++;
    if (it.state === 'PAUSED' || it.state === 'FAILED') pausedOrFailed++;
    if (it.state === 'FAILED') failed++;
    if (it.state === 'COMPLETED') completed++;
  });
  document.getElementById('pauseAllBtn').classList.toggle('hidden', active === 0);
  document.getElementById('resumeAllBtn').classList.toggle('hidden', pausedOrFailed === 0);
  document.getElementById('retryFailedBtn').classList.toggle('hidden', failed === 0);
  document.getElementById('clearCompletedBtn').classList.toggle('hidden', completed === 0);
  document.getElementById('downloadsToolbar').classList.toggle(
    'hidden', active === 0 && pausedOrFailed === 0 && completed === 0
  );
}

let lastStructSig = '';
let lastIdListSig = '';
let lastRowSig = {};

function structSig(items) {
  return items.map(function (it) {
    return it.id + '|' + it.state + '|' + (it.error ? '|e' : '') + '|' + it.fileName + '|' + it.addedAt;
  }).join(';');
}

var EMPTY_ICONS = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',

  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',

};

function emptyHtml(kind, title, sub, cta) {
  const ico = EMPTY_ICONS[kind] || EMPTY_ICONS.folder;
  return '<div class="empty"><span class="ico">' + ico + '</span>' +
    '<div class="t">' + title + '</div>' +
    (sub ? '<div class="s">' + sub + '</div>' : '') +
    (cta ? '<div class="cta"><button type="button" class="pill primary">' + cta + '</button></div>' : '') +
    '</div>';
}

function render(items) {
  const list = document.getElementById('list');
  currentItems = items.slice();
  const struct = (webFilter || '') + '::' + structSig(items);
  if (struct !== lastStructSig) {
    lastStructSig = struct;
    rebuildList(items);
    return;
  }
  updateRows(items);
}

function rowSubHtml(it) {
  const prog = it.totalBytes > 0 ? Math.round(it.bytesDownloaded * 100 / it.totalBytes) : 0;
  let meta = it.totalBytes > 0
    ? prog + '% \u00b7 ' + fmt(it.bytesDownloaded) + ' / ' + fmt(it.totalBytes)
    : fmt(it.bytesDownloaded);
  if (it.state === 'DOWNLOADING' && it.speedBps > 0) {
    meta += ' \u00b7 ' + fmtSpeed(it.speedBps);
    if (it.etaSeconds > 0) meta += ' \u00b7 ETA ' + fmtEta(it.etaSeconds);
  }
  return '<div class="item-sub">' +
    '<div class="meta">' + stateBadge(it.state) + '<span>' + meta + '</span></div>' +
    '<div class="bar"><div class="fill" style="width:' + prog + '%"></div></div>' +
    '</div>';
}

function updateRows(items) {
  const list = document.getElementById('list');
  if (!list.querySelector('li[data-id]')) {
    rebuildList(items);
    return;
  }
  const rows = {};
  list.querySelectorAll('li[data-id]').forEach(function (li) { rows[li.dataset.id] = li; });
  items.forEach(function (it) {
    const li = rows[it.id];
    if (!li) return;
    const sig = it.state + '|' + it.bytesDownloaded + '|' + it.speedBps + '|' + it.etaSeconds;
    if (lastRowSig[it.id] === sig) return;
    lastRowSig[it.id] = sig;
    const sub = li.querySelector('.item-sub');
    if (sub) sub.outerHTML = rowSubHtml(it);
  });
  renderSpeedTotal(items);
  updateToolbar(items);
}

function rebuildList(items) {
  lastRowSig = {};
  const list = document.getElementById('list');
  list.innerHTML = '';
  const idListSig = items.map(function (it) { return it.id + '|' + it.state; }).join(';');
  const idsChanged = idListSig !== lastIdListSig;
  const firstRender = lastIdListSig === '';
  lastIdListSig = idListSig;

  items = items.slice().sort(function (a, b) {
    const actA = a.state === 'DOWNLOADING' || a.state === 'PENDING' ? 0 : 1;
    const actB = b.state === 'DOWNLOADING' || b.state === 'PENDING' ? 0 : 1;
    const d = actA - actB;
    return d !== 0 ? d : ((b.addedAt || 0) - (a.addedAt || 0));
  });
  renderSpeedTotal(items);
  updateToolbar(items);
  const filtered = items.filter(function (it) {
    if (webFilter === 'ALL') return true;
    if (webFilter === 'ACTIVE') return it.state === 'DOWNLOADING' || it.state === 'PENDING';
    if (webFilter === 'COMPLETED') return it.state === 'COMPLETED';
    return it.state === 'FAILED' || it.state === 'CANCELLED';
  });
  if (!filtered.length) {
    if (items.length) {
      list.innerHTML = emptyHtml('search', 'Tidak ada item di filter ini', 'Coba pilih filter lain.');
    } else {
      list.innerHTML = emptyHtml(
        'download',
        'Belum ada download',
        'Ketuk tombol + New Download untuk mulai.',
        'Tambah Download'
      );
      const cta = list.querySelector('.cta button');
      if (cta) cta.addEventListener('click', onNewDownloadClick);
    }
    return;
  }
  let idx = 0;
  for (const it of filtered) {
    const li = document.createElement('li');
    li.className = 'item';
    li.setAttribute('tabindex', '0');
    li.setAttribute('data-id', it.id);
    if (firstRender || idsChanged) {
      li.classList.add('anim');
      li.style.animationDelay = Math.min(idx * 40, 400) + 'ms';
    }
    idx++;
    const err = it.error ? '<div class="err">' + escapeHtml(it.error) + '</div>' : '';
    li.innerHTML =
      '<div class="item-top"><div class="icon">' + fileIcon(it.fileName) + '</div><div class="item-body">' +
      '<div class="name">' + escapeHtml(it.fileName) + '</div>' + err +
      '</div>' +
      '<button class="item-menu-btn" type="button" title="Aksi">\u22EF</button>' +
      '</div>' +
      rowSubHtml(it);
    const menuBtn = li.querySelector('.item-menu-btn');
    if (menuBtn) {
      menuBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        openItemSheet(it);
      });
    }
    list.appendChild(li);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

    showConfirm('Hapus item?', 'Hapus \"' + label + '\" dari daftar download? File di device juga ikut terhapus.', 'Hapus', function () { doActionNow(id, action); });
    return;

  if (action === 'clear_completed') {
    showConfirm('Bersihkan daftar selesai?', 'Semua item berstatus Selesai akan dikeluarkan dari daftar. File di device TIDAK ikut terhapus.', 'Bersihkan', function () { doActionNow(id, action); });

    return;

let sse = null;
let sseFailCount = 0;
let lastSseAt = 0;
function connectEvents() {
  if (sse) { try { sse.close(); } catch (e) {} }
  sse = new EventSource(API + '/api/events');
  sse.onopen = function () { sseFailCount = 0; hideConnBanner(); };
  sse.onmessage = function (ev) {
    sseFailCount = 0;
    lastSseAt = Date.now();
    hasLoadedItems = true;
    document.getElementById('deviceStatus').classList.remove('offline');
    try {
      const data = JSON.parse(ev.data);
      if (data.shutdown) {
        showConnBanner('Server dihentikan atau port berubah. Cek aplikasi → Remote (HTTP) untuk alamat baru.');
        return;
      }
      const items = data.items || [];
      lastItems = items;
      if (data.status) renderStatus(data.status);
      render(items);
    } catch (e) {}
  };
  sse.onerror = function () {
    sseFailCount++;
    if (sseFailCount > 2) {
      document.getElementById('deviceStatus').classList.add('offline');
      showConnBanner('Koneksi realtime terputus. Cek server di aplikasi masih hidup.');
    }
  };
}
// SEKSI: SSE (EventSource) + polling adaptif + reconnect
// SSE (bila hidup) adalah sumber utama realtime; polling hanya pengaman saat
// stream diam/terblokir (mis. buffering proxy WISP). Interval naik-turun:
// cepat saat ada transfer aktif, lambat saat idle. Bila SSE "terlihat" terbuka
// tapi tidak mengirim apa-apa terlalu lama, paksa buka ulang EventSource.
let lastItems = [];
let lastForcedReconnectAt = 0;
let pollTimer = null;
const POLL_FAST_MS = 700;
const POLL_IDLE_MS = 10000;
const SSE_SILENT_MS = 20000;
const SSE_RECONNECT_COOLDOWN_MS = 10000;

function anyActiveTransfer() {
  if (fsUploading) return true;
  for (let i = 0; i < lastItems.length; i++) {
    const st = lastItems[i].state;
    if (st === 'DOWNLOADING' || st === 'PENDING') return true;
  }
  return false;
}

async function pollSnapshot() {
  try {
    const res = await fetch(API + '/api/snapshot');
    if (!res.ok) {
      if (res.status === 401) return;
      throw new Error('HTTP ' + res.status);
    }
    const data = await res.json();
    failCount = 0;
    hasLoadedItems = true;
    document.getElementById('status').textContent = '';
    document.getElementById('deviceStatus').classList.remove('offline');
    hideConnBanner();
    if (data.status) renderStatus(data.status);
    const items = data.items || [];
    lastItems = items;
    if (currentRoute() === 'downloads') render(items);
  } catch (e) {
    failCount++;
    if (failCount > 2) {
      document.getElementById('status').textContent = 'Tidak dapat terhubung ke server. Cek server di aplikasi.';
    }
  }
}

function pollTick() {
  // SSE diam terlalu lama (stream terbuka tapi tidak ada data): paksa
  // reconnect, biasanya memulihkan realtime tanpa polling terus-menerus.
  if (sse && sse.readyState === EventSource.OPEN &&
      Date.now() - lastSseAt > SSE_SILENT_MS &&
      Date.now() - lastForcedReconnectAt > SSE_RECONNECT_COOLDOWN_MS) {
    lastForcedReconnectAt = Date.now();
    connectEvents();
  }
  const stale = !sse || sse.readyState !== EventSource.OPEN ||
    Date.now() - lastSseAt > 4000;
  if (stale) pollSnapshot();
  pollTimer = setTimeout(pollTick, anyActiveTransfer() ? POLL_FAST_MS : POLL_IDLE_MS);
}

function startPolling() {
  connectEvents();
  pollTimer = setTimeout(pollTick, anyActiveTransfer() ? POLL_FAST_MS : POLL_IDLE_MS);
}

// Tab kembali terlihat (habis tidur/minimize): segarkan segera tanpa nunggu
// interval polling berikutnya.
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') pollSnapshot();
});

if (typeof EventSource !== 'undefined') {
  startPolling();
} else {
  // Browser tanpa EventSource (sangat tua): polling adaptif saja.
  sse = null;
  pollTimer = setTimeout(pollTick, anyActiveTransfer() ? POLL_FAST_MS : POLL_IDLE_MS);
}
</script>
