name: Build APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  # Build terjadwal (mingguan): pastikan repo tetap build dengan toolchain
  # terbaru walau tidak ada perubahan. Tidak mem-publish release.
  schedule:
    - cron: "0 3 * * 1"

# Batal run lama saat push/PR baru di ref yang sama — hemat menit Actions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Guard CHANGELOG butuh commit base (push/PR) — history penuh
          # supaya git diff tidak gagal di clone shallow.
          fetch-depth: 0

      - name: Pastikan CHANGELOG diperbarui untuk perubahan kode
        # PR Dependabot (bump dependensi) dikecualikan — changelog dirangkum di
        # rilis maintenance; perubahan dependensi wajib regenerasi
        # verification-metadata (lihat AGENTS.md).
        if: github.actor != 'dependabot[bot]'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "null" ]; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Base commit tidak tersedia (push pertama / manual) — lewati guard CHANGELOG."
            exit 0
          fi
          git fetch origin main --quiet || true
          CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only "$BASE" HEAD || true)
          NEEDS_CHANGELOG=$(echo "$CHANGED" | grep -E '^(app/src/main/|remote\.src\.html$|app/build\.gradle\.kts$|scripts/)' || true)
          HAS_CHANGELOG=$(echo "$CHANGED" | grep -x 'CHANGELOG.md' || true)
          if [ -n "$NEEDS_CHANGELOG" ] && [ -z "$HAS_CHANGELOG" ]; then
            echo "::error::Perubahan kode (app/src/main, remote.src.html, app/build.gradle.kts, scripts/) wajib menyertakan update CHANGELOG.md"
            echo "$NEEDS_CHANGELOG"
            exit 1
          fi
          echo "Guard CHANGELOG: OK"

      - name: Siapkan & periksa remote web (minify + node check + i18n)
        run: python3 scripts/prepare_remote.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cek kesehatan keystore (fingerprint signing)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          EXPECT="c2785a618082683755eeae867e0a2e01f450b1fd448859d1ec21cf854c5713d1"
          FP=$(keytool -exportcert -keystore /tmp/keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | openssl dgst -sha256 | awk '{print $2}')
          echo "Fingerprint sertifikat signing: ${FP:-<tidak terbaca>}"
          if [ -z "$FP" ] || [ "$FP" != "$EXPECT" ]; then
            echo "::error::Fingerprint keystore tidak cocok dengan kunci release resmi (expected $EXPECT, got $FP)"
            exit 1
          fi
          echo "Keystore sehat: sesuai kunci release resmi."

          # Cek masa berlaku sertifikat: error bila < 90 hari, warning bila < 180 hari.
          EXPIRY=$(keytool -list -v -keystore /tmp/keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Valid from: .* until: \(.*\)$/\1/p')
          if [ -n "$EXPIRY" ]; then
            EXP_EPOCH=$(date -d "$EXPIRY" +%s 2>/dev/null || echo "")
            if [ -n "$EXP_EPOCH" ]; then
              DAYS=$(( (EXP_EPOCH - $(date +%s)) / 86400 ))
              echo "Sertifikat berlaku sampai: $EXPIRY (sisa $DAYS hari)"
              if [ "$DAYS" -lt 90 ]; then
                echo "::error::Sertifikat keystore hampir kedaluwarsa (sisa $DAYS hari) — perbarui keystore segera!"
                exit 1
              fi
              if [ "$DAYS" -lt 180 ]; then
                echo "::warning::Sertifikat keystore sisa $DAYS hari — rencanakan perbaruan."
              fi
            else
              echo "::warning::Format tanggal kedaluwarsa tidak dikenal — lewati cek masa berlaku."
            fi
          fi

      - name: Set up Gradle (cache + verifikasi wrapper)
        uses: gradle/actions/setup-gradle@v6

      - name: Bump versionCode otomatis per build
        run: |
          CODE=$((100000 + ${{ github.run_number }}))
          sed -i "s/versionCode = [0-9]*/versionCode = ${CODE}/" app/build.gradle.kts
          echo "versionCode baru: ${CODE}"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Lint & unit test
        run: ./gradlew lintDebug testDebugUnitTest

      - name: Tampilkan laporan lint di log
        if: always()
        run: cat app/build/reports/lint-results-debug.txt || true

      - name: Coverage JaCoCo (laporan + ambang batas)
        run: |
          echo "=== coverage: gradle mulai ==="
          ./gradlew jacocoTestReport jacocoTestCoverageVerification
          echo "=== coverage: gradle selesai ==="
          ls -la app/build/reports/jacoco/jacocoTestReport/ 2>/dev/null || echo "(folder laporan belum ada)"
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          print("PYTHON RAN")
          files = glob.glob("app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml")
          print("XML files:", files)
          if not files:
              print("::warning::Laporan JaCoCo tidak ditemukan")
              raise SystemExit(0)
          root = ET.parse(files[0]).getroot()
          print("XML root:", root.tag)
          counters = list(root.iter("counter"))
          print("counter count:", len(counters))
          if counters:
              print("first counter attrs:", counters[0].attrib)
          import subprocess
          print(subprocess.run(["find", "app/build", "-name", "*.exec", "-o", "-type", "d", "-name", "classes"], capture_output=True, text=True).stdout)
          summary = []
          for ctype in ("LINE", "BRANCH", "INSTRUCTION", "METHOD"):
              covered = missed = 0
              for c in root.iter("counter"):
                  if c.get("type") == ctype:
                      covered += int(c.get("covered", 0))
                      missed += int(c.get("missed", 0))
              total = covered + missed
              if total:
                  pct = covered / total
                  line = f"- {ctype}: {pct:.1%} ({covered}/{total})"
                  summary.append(line)
                  print(f"JaCoCo {ctype}: {pct:.1%} ({covered}/{total})")
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary and summary:
              with open(step_summary, "a", encoding="utf-8") as fh:
                  fh.write("### JaCoCo coverage (unit test)\n\n")
                  fh.write("\n".join(summary) + "\n")
          PY

      - name: Build release APK (jika secret signing tersedia)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ./gradlew assembleRelease \
            -PstoreFile=keystore.jks \
            -PstorePassword="$KEYSTORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD"

      - name: Verifikasi tanda tangan APK release (kunci resmi)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          EXPECT="c2785a618082683755eeae867e0a2e01f450b1fd448859d1ec21cf854c5713d1"
          FP=$(keytool -printcert -jarfile "$APK" 2>/dev/null | awk '/^[[:space:]]*SHA256:/ {gsub(":", "", $2); print tolower($2)}' | head -1)
          echo "SHA-256 sertifikat pada APK: ${FP:-<tidak terbaca>}"
          if [ -z "$FP" ] || [ "$FP" != "$EXPECT" ]; then
            echo "::error::APK release tidak ditandatangani kunci resmi (expected $EXPECT, got $FP)"
            exit 1
          fi
          echo "APK release: ditandatangani kunci release resmi."

      - name: Cek ukuran APK (jaga APK tetap kecil)
        if: always()
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$RELEASE_APK" ]; then
            APK="$RELEASE_APK"; LIMIT=3670016; LABEL="release"
          else
            APK="$DEBUG_APK"; LIMIT=10485760; LABEL="debug (tanpa minify)"
          fi
          if [ ! -f "$APK" ]; then
            echo "APK $LABEL belum ada (build sebelumnya gagal) — lewati cek ukuran."
            exit 0
          fi
          SIZE=$(stat -c %s "$APK")
          echo "Ukuran APK $LABEL (${APK##*/}): $SIZE bytes"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::APK $LABEL terlalu besar: $SIZE > $LIMIT bytes"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        # Schedule (build mingguan) hanya verifikasi build, tidak publish release.
        if: github.event_name != 'pull_request' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          OUT="tasirin-download-manager-v${VER}-${CODE}.apk"
          if [ -n "$KEYSTORE_BASE64" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$OUT"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          fi
          NOTES=$(python3 -c "import re; s=open('CHANGELOG.md', encoding='utf-8').read(); m=re.search(r'^## .*?(?=\n## |\Z)', s, re.M | re.S); print(m.group(0).strip() if m else '')")
          if [ -z "$NOTES" ]; then
            NOTES="APK rilis terbaru (build ${CODE}), ditandatangani dengan kunci release resmi (bukan debug). Unduh lalu pasang di HP/TV box."
          fi
          gh release delete "v${VER}" --yes --cleanup-tag || true
          # Lampirkan mapping.txt (deobfuscation R8) bila ada — tidak masuk APK.
          MAPPING_ARGS=""
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            MAPPING_ARGS="app/build/outputs/mapping/release/mapping.txt"
          fi
          gh release create "v${VER}" "$OUT" $MAPPING_ARGS \
            --title "Tasirin Download Manager v${VER} (build ${CODE})" \
            --notes "$NOTES" \
            --latest

      - name: VirusTotal submit (jika API key tersedia)
        id: vt-submit
        # Jalan juga di PR (repositori sama): APK yang mau di-merge ikut di-scan.
        if: env.VT_API_KEY != ''
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [ -f app/build/outputs/apk/release/app-release.apk ] && APK="app/build/outputs/apk/release/app-release.apk"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "Mengunggah $APK ke VirusTotal..."
          echo "SHA-256: $SHA"
          RESP=$(curl -s --max-time 120 -H "x-apikey: $VT_API_KEY" \
            --form "file=@$APK" https://www.virustotal.com/api/v3/files)
          ID=$(echo "$RESP" | jq -r '.data.id // empty')
          if [ -z "$ID" ]; then
            echo "::warning::VirusTotal menolak upload: $(echo "$RESP" | jq -c '.error // .' | head -c 300)"
          else
            echo "VirusTotal analysis id: $ID"
            echo "VirusTotal report: https://www.virustotal.com/gui/file/$SHA"
            echo "id=$ID" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: VirusTotal tunggu hasil & ringkasan
        if: steps.vt-submit.outputs.id != ''
        run: |
          ID="${{ steps.vt-submit.outputs.id }}"
          SHA="${{ steps.vt-submit.outputs.sha }}"
          STATUS="queued"
          TRIES=0
          while [ "$STATUS" = "queued" ] || [ "$STATUS" = "in-progress" ]; do
            TRIES=$((TRIES + 1))
            if [ "$TRIES" -gt 30 ]; then
              echo "::warning::VirusTotal belum selesai setelah ~10 menit — cek manual: https://www.virustotal.com/gui/file/$SHA"
              exit 0
            fi
            sleep 20
            RESP=$(curl -s --max-time 60 -H "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/analyses/$ID")
            STATUS=$(echo "$RESP" | jq -r '.data.attributes.status // "queued"')
          done
          echo "Status analisis: $STATUS"
          if [ "$STATUS" != "completed" ]; then
            echo "::warning::Analisis VirusTotal selesai dengan status '$STATUS' — cek manual: https://www.virustotal.com/gui/file/$SHA"
            exit 0
          fi
          STATS=$(echo "$RESP" | jq -c '.data.attributes.stats // {}')
          MALICIOUS=$(echo "$STATS" | jq -r '.malicious // 0')
          SUSPICIOUS=$(echo "$STATS" | jq -r '.suspicious // 0')
          TOTAL=$(echo "$STATS" | jq '[.[] | numbers] | add // 0')
          echo "VirusTotal: $MALICIOUS dari $TOTAL engine mendeteksi malware"
          echo "  malicious: $MALICIOUS | suspicious: $SUSPICIOUS | total: $TOTAL"
          if [ "$MALICIOUS" -gt 0 ] || [ "$SUSPICIOUS" -gt 0 ]; then
            echo "::warning::VirusTotal melaporkan $MALICIOUS malicious / $SUSPICIOUS suspicious — cek https://www.virustotal.com/gui/file/$SHA"
            echo "$RESP" | jq -r '.data.attributes.results // {} | to_entries[] | select(.value.category == "malicious" or .value.category == "suspicious") | "  - \(.key): \(.value.result // .value.category)"'
          else
            echo "VirusTotal: bersih (tidak ada deteksi)"
          fi
          {
            echo "### VirusTotal"
            echo ""
            echo "- Status: **completed**"
            echo "- Deteksi: **$MALICIOUS/$TOTAL** engine"
            echo "- Report: https://www.virustotal.com/gui/file/$SHA"
          } >> "$GITHUB_STEP_SUMMARY"
