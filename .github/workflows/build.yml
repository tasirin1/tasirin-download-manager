name: Build APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle (cache + verifikasi wrapper)
        uses: gradle/actions/setup-gradle@v5

      - name: Bump versionCode otomatis per build
        run: |
          CODE=$((100000 + ${{ github.run_number }}))
          sed -i "s/versionCode = [0-9]*/versionCode = ${CODE}/" app/build.gradle.kts
          echo "versionCode baru: ${CODE}"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Lint & unit test
        run: ./gradlew lintDebug testDebugUnitTest

      - name: Build release APK (jika secret signing tersedia)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ./gradlew assembleRelease \
            -PstoreFile=keystore.jks \
            -PstorePassword="$KEYSTORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v6
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          OUT="tasirin-download-manager-v${VER}-${CODE}.apk"
          if [ -n "$KEYSTORE_BASE64" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$OUT"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          fi
          gh release delete "v${VER}" --yes --cleanup-tag || true
          gh release create "v${VER}" "$OUT" \
            --title "Tasirin Download Manager v${VER} (build ${CODE})" \
            --notes "APK rilis terbaru (build ${CODE}), ditandatangani dengan kunci release resmi (bukan debug). Unduh lalu pasang di HP/TV box. Beri izin Penyimpanan saat diminta." \
            --latest
