name: Build APK

on:
  push:
    branches: ["main"]
    # Push docs-only tak menyentuh APK: hemat satu build + satu nomor rilis.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

# Batal run lama saat push/PR baru di ref yang sama — hemat menit Actions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verifikasi cepat (tanpa SDK)
    # Batas keras (issue #334): tanpa ini proses yang menggantung
    # (mis. gh api) menahan job — dan seluruh antrean build — sampai
    # batas default GitHub 360 menit. Job ini normalnya < 5 menit.
    timeout-minutes: 15
    # Job ini mengeksekusi skrip dari checkout PR — baca saja (issue #185).
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Guard CHANGELOG butuh history penuh supaya git diff tidak gagal.
          fetch-depth: 0

      - name: Pastikan CHANGELOG diperbarui untuk perubahan kode
        # PR Dependabot (bump dependensi) dikecualikan — changelog dirangkum di
        # rilis maintenance; perubahan dependensi wajib regenerasi
        # verification-metadata (lihat AGENTS.md).
        if: github.actor != 'dependabot[bot]'
        env:
          # Verifikasi API untuk pengecualian bot (#290) butuh token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_changelog.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.before }}"

      - name: Siapkan & periksa remote web (minify + node check + i18n)
        run: python3 scripts/prepare_remote.py --check

      - name: Cek sinkron README & README.en (struktur heading)
        run: python3 scripts/check_readme_sync.py

      - name: Pindai bug, error, dan celah keamanan
        run: |
          python3 scripts/security_audit.py --self-test
          python3 scripts/security_audit.py

      - name: Verifikasi path (tanpa SDK Android)
        # Dulu workflow verifikasi-path.yml tersendiri; kini satu gerbang di
        # sini agar satu status, satu runner, tanpa duplikasi checkout.
        # Rentang event WAJIB diteruskan: tanpa --rentang skrip jatuh ke
        # diff HEAD~1 sehingga cek berbasis diff hanya menilai commit
        # terakhir dari push/PR multi-commit (issue #156).
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            python3 tools/verifikasi-path.py --rentang "$BASE...${{ github.sha }}"
          else
            python3 tools/verifikasi-path.py
          fi

      - name: Cek cepat (vektor 0.x, README, secret, remote)
        run: bash scripts/cek-cepat.sh

      - name: Guard konsistensi repo (check_repo.py)
        # Dulu hanya jalan lewat hook pre-commit lokal yang opt-in —
        # drift AGENTS.md vs wrapper lolos saat merge PR #135 (issue #184).
        run: python3 scripts/check_repo.py

  build:
    name: Build APK
    # Satu-satunya job yang butuh tulis (rilis GitHub) (issue #185).
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    needs: verify
    env:
      # Hanya bendera kehadiran di level job (#297): nilai secret
      # keystore sendiri TIDAK lagi terekspos ke semua langkah — ia
      # disuntikkan per-langkah hanya di langkah yang memakainya.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Catatan rilis memakai git diff CHANGELOG — history penuh.
          fetch-depth: 0

      - name: Siapkan nomor versi (env VER_CODE/VER_NAME)
        # Ekspresi GitHub tak mendukung aritmetika `+` di sini (run gagal
        # startup 0-job) — hitung di shell, teruskan via GITHUB_ENV.
        run: |
          echo "VER_CODE=$((100000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          # Skema rollover (keputusan owner 2026-10-28): komponen ketiga
          # TIDAK mencapai 1000 — nomor lari 999 = v1.0.999, berikutnya
          # v1.1.0, lalu naik terus (minor = lari/1000, patch = sisa).
          # VER_CODE tetap 100000+lari (monoton, tak berubah maknanya).
          echo "VER_NAME=1.$(( ${{ github.run_number }} / 1000 )).$(( ${{ github.run_number }} % 1000 ))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # Paket "tools" sudah dihapus dari repositori Google (deprecated);
          # cukup platform-tools — platform/build-tools diunduh AGP sendiri.
          packages: 'platform-tools'

      - name: Cek kesehatan keystore (fingerprint signing)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Keystore hasil decode tidak boleh tertinggal di filesystem
          # runner untuk langkah-langkah sesudahnya (#330): trap EXIT
          # menghapusnya apa pun hasil langkah ini; langkah build
          # men-decode ulang sendiri dari secret-nya.
          trap 'rm -f /tmp/keystore.jks' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          EXPECT="c2785a618082683755eeae867e0a2e01f450b1fd448859d1ec21cf854c5713d1"
          FP=$(keytool -exportcert -keystore /tmp/keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | openssl dgst -sha256 | awk '{print $2}')
          echo "Fingerprint sertifikat signing: ${FP:-<tidak terbaca>}"
          if [ -z "$FP" ] || [ "$FP" != "$EXPECT" ]; then
            echo "::error::Fingerprint keystore tidak cocok dengan kunci release resmi (expected $EXPECT, got $FP)"
            exit 1
          fi
          echo "Keystore sehat: sesuai kunci release resmi."

          # Cek masa berlaku sertifikat: error bila < 90 hari, warning bila < 180 hari.
          EXPIRY=$(keytool -list -v -keystore /tmp/keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Valid from: .* until: \(.*\)$/\1/p')
          if [ -n "$EXPIRY" ]; then
            EXP_EPOCH=$(date -d "$EXPIRY" +%s 2>/dev/null || echo "")
            if [ -n "$EXP_EPOCH" ]; then
              DAYS=$(( (EXP_EPOCH - $(date +%s)) / 86400 ))
              echo "Sertifikat berlaku sampai: $EXPIRY (sisa $DAYS hari)"
              if [ "$DAYS" -lt 90 ]; then
                echo "::error::Sertifikat keystore hampir kedaluwarsa (sisa $DAYS hari) — perbarui keystore segera!"
                exit 1
              fi
              if [ "$DAYS" -lt 180 ]; then
                echo "::warning::Sertifikat keystore sisa $DAYS hari — rencanakan perbaruan."
              fi
            else
              echo "::warning::Format tanggal kedaluwarsa tidak dikenal — lewati cek masa berlaku."
            fi
          fi

      - name: Set up Gradle (cache + verifikasi wrapper)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Build debug APK (verifikasi PR saja)
        # Push main/manual langsung build release (hemat 1x compile
        # penuh); debug hanya untuk verifikasi compile di PR.
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug -PverCode="$VER_CODE" -PverName="$VER_NAME"

      - name: Lint (hanya PR)
        # lintDebug lambat (1-3 mnt); kode main normalnya sudah lolos saat PR.
        if: github.event_name == 'pull_request'
        run: ./gradlew lintDebug

      - name: Unit test
        run: ./gradlew testDebugUnitTest

      - name: Upload laporan lint (bila gagal)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore

      - name: Coverage JaCoCo (laporan + ambang batas)
        run: |
          ./gradlew jacocoTestReport jacocoTestCoverageVerification
          python3 scripts/jacoco_summary.py

      - name: Build release APK (jika secret signing tersedia)
        # Dilewati di PR: debug sudah verifikasi compile (hemat 1x build R8).
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          trap 'rm -f /tmp/keystore.jks' EXIT
          [ -f /tmp/keystore.jks ] || echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          ./gradlew assembleRelease -PverCode="$VER_CODE" -PverName="$VER_NAME" \
            -PstoreFile=/tmp/keystore.jks \
            -PstorePassword="$KEYSTORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD"

      - name: Verifikasi tanda tangan APK release (kunci resmi)
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          EXPECT="c2785a618082683755eeae867e0a2e01f450b1fd448859d1ec21cf854c5713d1"
          FP=$(keytool -printcert -jarfile "$APK" 2>/dev/null | awk '/^[[:space:]]*SHA256:/ {gsub(":", "", $2); print tolower($2)}' | head -1)
          echo "SHA-256 sertifikat pada APK: ${FP:-<tidak terbaca>}"
          if [ -z "$FP" ] || [ "$FP" != "$EXPECT" ]; then
            echo "::error::APK release tidak ditandatangani kunci resmi (expected $EXPECT, got $FP)"
            exit 1
          fi
          echo "APK release: ditandatangani kunci release resmi."

      - name: Cek batas ukuran (APK + remote.html)
        if: always()
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$RELEASE_APK" ]; then
            APK="$RELEASE_APK"; LIMIT=3670016; LABEL="release"
          else
            APK="$DEBUG_APK"; LIMIT=10485760; LABEL="debug (tanpa minify)"
          fi
          if [ ! -f "$APK" ]; then
            echo "APK $LABEL belum ada (build sebelumnya gagal) — lewati cek ukuran."
          else
            SIZE=$(stat -c %s "$APK")
            echo "Ukuran APK $LABEL (${APK##*/}): $SIZE bytes"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::APK $LABEL terlalu besar: $SIZE > $LIMIT bytes"
              exit 1
            fi
          fi
          F="app/src/main/assets/remote.html"
          LIMIT=307200
          SIZE=$(stat -c %s "$F")
          echo "Ukuran remote.html: $SIZE bytes (batas $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::remote.html terlalu besar: $SIZE > $LIMIT bytes (cek minify prepare_remote.py)"
            exit 1
          fi

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish & audit rilis
        # Hanya PR yang tidak publish (push main + manual publish lalu audit).
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$VER_NAME"
          CODE="$VER_CODE"
          OUT="tasirin-download-manager-v${VER}.apk"
          # Cukup bendera kehadiran job (#330): nilai secret TIDAK
          # disuntikkan ke langkah yang menjalankan rangkaian gh
          # release ini — prinsip #297 (secret hanya di langkah yang
          # benar-benar memakainya).
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::Secret signing tidak tersedia — tak ada APK release untuk dipublish (debug hanya dibangun di PR)."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          NOTES=""
          # Catatan rilis = entri CHANGELOG yang ditambah push ini saja (maks 15
          # baris), bukan seluruh seksi [Unreleased] yang menumpuk. Push tanpa
          # entri baru (mis. chore metadata) memakai teks generik.
          BASE="${{ github.event.before }}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            NOTES=$(git diff "$BASE" HEAD -- CHANGELOG.md 2>/dev/null | grep -E '^\+- ' | sed 's/^+//' | head -n 15)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="APK rilis terbaru (build ${CODE}), ditandatangani dengan kunci release resmi (bukan debug). Unduh lalu pasang di HP/TV box."
          fi
          # Tag unik per build (v<VER_NAME>) — rilis lama dipertahankan
          # sebagai riwayat; delete hanya untuk idempotensi bila job rerun.
          gh release delete "v${VER}" --yes --cleanup-tag || true
          # --latest hanya bila nomor build ini >= latest saat ini: re-run
          # manual run lama tidak boleh menurunkan rilis yang lebih baru
          # menjadi sekadar riwayat (issue #153).
          LATEST_ARGS="--latest"
          CURRENT_LATEST=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || true)
          if [ -n "$CURRENT_LATEST" ]; then
            # Nomor lari latest saat ini dari tag-nya: skema baru
            # v1.<minor>.<patch> -> minor*1000+patch; tag lama
            # v1.0.<n> (n bisa >999) terpetakan benar oleh rumus sama.
            CUR_VER="${CURRENT_LATEST#v}"
            CUR_MINOR="${CUR_VER#*.}"; CUR_MINOR="${CUR_MINOR%%.*}"
            CUR_PATCH="${CUR_VER##*.}"
            case "$CUR_MINOR" in *[!0-9]*|"") CUR_MINOR=0 ;; esac
            case "$CUR_PATCH" in *[!0-9]*|"") CUR_PATCH=0 ;; esac
            CUR_NUM=$((CUR_MINOR * 1000 + CUR_PATCH))
            if [ "${{ github.run_number }}" -lt "$CUR_NUM" ]; then
              LATEST_ARGS=""
              echo "Build ${{ github.run_number }} lebih lama dari latest saat ini ($CURRENT_LATEST) - rilis dibuat TANPA --latest."
            fi
          fi
          # Lampirkan mapping.txt (deobfuscation R8) bila ada — tidak masuk APK.
          MAPPING_ARGS=""
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            MAPPING_ARGS="app/build/outputs/mapping/release/mapping.txt"
          fi
          gh release create "v${VER}" "$OUT" $MAPPING_ARGS \
            --title "Tasirin Download Manager v${VER} (build ${CODE})" \
            --notes "$NOTES" \
            $LATEST_ARGS

          echo "--- Audit rilis v${VER} ---"
          EXPECTED_APK="$OUT"
          LATEST_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')
          RELEASE=$(gh release view "v${VER}" --json name,assets)

          if [ -n "$LATEST_ARGS" ]; then
            [ "${LATEST_TAG}" = "v${VER}" ] \
              || { echo "::error::Release v${VER} bukan release terbaru (latest: ${LATEST_TAG})"; exit 1; }
          else
            echo "Audit latest dilewati: build lama di-re-run, latest tetap ${LATEST_TAG}."
          fi

          EXPECTED_NAME="Tasirin Download Manager v${VER} (build ${CODE})"
          echo "$RELEASE" | jq -e --arg name "${EXPECTED_NAME}" '.name == $name' >/dev/null \
            || { echo "::error::Judul release v${VER} tidak sesuai build ${CODE}"; exit 1; }
          echo "$RELEASE" | jq -e --arg apk "${EXPECTED_APK}" \
            '[.assets[] | select(.name == $apk)] | length == 1 and .[0].size > 0 and .[0].size <= 3670016' >/dev/null \
            || { echo "::error::Asset ${EXPECTED_APK} tidak ada, duplikat, kosong, atau melebihi batas"; exit 1; }
          echo "$RELEASE" | jq -e '.assets[] | select(.name == "mapping.txt") | .size > 0' >/dev/null \
            || { echo "::error::mapping.txt tidak ada atau kosong pada release v${VER}"; exit 1; }
          echo "Rilis v${VER}: asset ${EXPECTED_APK} + mapping.txt sehat."
