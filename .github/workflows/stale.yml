name: Stale

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Tutup PR/issue tidak aktif
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 45
          days-before-pr-stale: 21
          days-before-issue-close: 14
          days-before-pr-close: 14
          stale-issue-message: "Issue ini tidak ada aktivitas 45 hari dan ditandai stale. Balas di sini kalau masih relevan — bila 14 hari tidak ada respons, issue akan ditutup otomatis."
          stale-pr-message: "PR ini tidak ada aktivitas 21 hari dan ditandai stale. Push commit baru atau balas di sini kalau masih dikerjakan — bila 14 hari tidak ada respons, PR akan ditutup otomatis."
          close-issue-message: "Issue ditutup otomatis karena tidak ada aktivitas. Kalau masalahnya masih terjadi di rilis terbaru, silakan buka issue baru dengan menyertakan versi APK dan langkah reproduksi."
          close-pr-message: "PR ditutup otomatis karena tidak ada aktivitas. Silakan buka ulang bila masih relevan (rebase ke main terbaru dan pastikan CI hijau)."
          exempt-issue-labels: "help wanted,good first issue,enhancement,security"
          exempt-pr-labels: "dependencies"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          operations-per-run: 200
