name: Verifikasi Path

on:
  push:
    branches: [main]
    # Dokumen tak menyentuh kode: hemat menit CI.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifikasi:
    name: Cek path yang berubah
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verifikasi path (tanpa SDK Android)
        run: |
          # Skrip murni-Python: acuan yatim, manifest, XML, import mati,
          # larangan historis, kurung, hapusan salah, remote web, aturan repo.
          # Gagal di sini = push ditolak sebelum build APK jalan.
          python3 tools/verifikasi-path.py --rentang "${{ github.event.before }}...${{ github.sha }}"
      - name: Cek cepat (vektor 0.x, README, secret, remote)
        run: bash scripts/cek-cepat.sh
