name: Update dependency verification metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate verification-metadata.xml
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle (cache + verifikasi wrapper)
        # Langkah yang sama seperti build.yml (issue #382): tanpa ini
        # workflow manual ini mengunduh distribusi Gradle + dependensi
        # dari nol pada setiap jalan, dan wrapper tidak terverifikasi.
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Generate metadata (sha256 semua dependency)
        # Task build (bukan help) supaya semua artifact yang dipakai CI tercatat:
        # aapt2 binary, lint, unit test, debug+release, dll. Metadata yang
        # dihasilkan ini di-commit ke repo untuk verifikasi dependensi.
        run: ./gradlew --write-verification-metadata sha256 build --no-daemon

      - name: Upload gradle/verification-metadata.xml
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
