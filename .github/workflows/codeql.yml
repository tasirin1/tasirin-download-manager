name: CodeQL

on:
  push:
    branches: ["main"]
    # Samakan pola build.yml (issue #381): push/PR docs-only tidak
    # mengubah kode yang dianalisis — analisis terjadwal mingguan tetap
    # menangkap keadaan pohon apa pun.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - ".gitignore"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # Paket "tools" sudah dihapus dari repositori Google (deprecated);
          # cukup platform-tools — platform/build-tools diunduh AGP saat autobuild.
          packages: 'platform-tools'

      # Cache Gradle yang sama seperti build.yml (issue #701): tanpa
      # langkah ini autobuild mengunduh distribusi Gradle + seluruh
      # dependensi dari nol pada setiap push/PR/run mingguan.
      - name: Set up Gradle (cache + verifikasi wrapper)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:java-kotlin"
