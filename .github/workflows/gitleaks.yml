name: Gitleaks (deteksi secret)

on:
  push:
    branches: ["main"]
    # Push/PR docs-only tidak bisa memuat secret baru di kode — pola
    # paths-ignore yang sama seperti build.yml (issue #701).
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan secret
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
