name: Gitleaks (deteksi secret)

on:
  push:
    branches: ["main"]
    # Berbeda dari build.yml (issue #1123): scan secret itu murah
    # dan secret bisa hidup di berkas .md/docs juga, jadi gitleaks
    # TIDAK mengabaikan pola itu — push docs-only tetap terpindai
    # di sini. Yang tersisa hanya berkas yang memang di luar jangkauan
    # wajar secret (LICENSE, .gitignore). Pola build.yml yang
    # mengabaikan docs-only (issue #701) tidak berubah.
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan secret
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
