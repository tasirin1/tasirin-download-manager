# Update dependensi bertahap (aturan pengembangan #12): tiap PR Dependabot
# melewati build + lint + unit test di CI seperti PR biasa, tanpa release.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx:*"
      gradle-tools:
        patterns:
          - "com.android.tools:*"
          - "org.nanohttpd:*"
          - "junit:*"
          - "org.json:*"
          - "com.google.zxing:*"
    ignore:
      # Major AGP/Kotlin perlu upgrade Gradle dulu; tangani manual bertahap,
      # bukan PR otomatis yang gagal CI (AGENTS.md aturan #12).
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major"]
      # Semua material > 1.12 menuntut minSdk 23; proyek wajib minSdk 21 (Android 5+).
      - dependency-name: "com.google.android.material:material"
      # androidx.core 1.17+ menuntut compileSdk 36/37; proyek di compileSdk 35.
      # Buka lagi manual setelah upgrade AGP + compileSdk siap.
      - dependency-name: "androidx.core:core"
      # Versi terbaru activity/lifecycle menuntut minSdk 23 (proyek wajib 21/Android 5+).
      - dependency-name: "androidx.activity:activity-ktx"
      - dependency-name: "androidx.lifecycle:lifecycle-livedata-ktx"
      - dependency-name: "androidx.lifecycle:lifecycle-viewmodel-ktx"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
