# Update dependensi bertahap (aturan pengembangan #14 di AGENTS.md): tiap PR
# Dependabot melewati build + lint + unit test di CI seperti PR biasa, tanpa release.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      androidx:
        patterns:
          - "androidx*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx*"
      jvm-libs:
        patterns:
          - "org.nanohttpd*"
          - "junit*"
          - "org.json*"
      gradle-tools:
        patterns:
          - "com.android.tools*"
    ignore:
      # Major AGP/Kotlin perlu upgrade Gradle dulu; tangani manual bertahap,
      # bukan PR otomatis yang gagal CI (AGENTS.md aturan #14).
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major"]
      # Ignore lama (material, androidx.core, activity-ktx, lifecycle-*-ktx)
      # dicabut 2026-10-28: alasannya — minSdk 21 dan compileSdk 36 — sudah
      # tidak berlaku sesudah proyek naik ke minSdk 23 + compileSdk 37
      # (PR #116, issue #180).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
