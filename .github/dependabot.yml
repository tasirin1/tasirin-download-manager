# Update dependensi bertahap (aturan pengembangan #14 di AGENTS.md): tiap PR
# Dependabot melewati build + lint + unit test di CI seperti PR biasa, tanpa release.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      androidx:
        patterns:
          - "androidx*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx*"
      jvm-libs:
        patterns:
          - "org.nanohttpd*"
          - "junit*"
          - "org.json*"
      gradle-tools:
        patterns:
          - "com.android.tools*"
          # Plugin AGP dilaporkan Dependabot dengan nama
          # com.android.application (nama yang sama dipakai aturan
          # ignore major di bawah) — tanpa pola ini ia tak pernah
          # cocok grup perkakas dan PR-nya tiba berdiri sendiri
          # (issue #1110).
          - "com.android.application"
    ignore:
      # Major AGP perlu upgrade Gradle dulu; tangani manual bertahap,
      # bukan PR otomatis yang gagal CI (AGENTS.md aturan #14).
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      # Ignore org.jetbrains.kotlin.android DICABUT (issue #1089):
      # plugin Kotlin dibundel AGP 9 (built-in Kotlin) dan nama itu
      # tak dideklarasikan di katalog maupun build script mana pun,
      # jadi ignore-nya tak pernah bisa cocok — konfigurasi sampah
      # yang memberi kesan perlindungan major-Kotlin yang tak ada.
      # Versi Kotlin mengikuti AGP; naik major Kotlin = naik AGP.
      # Ignore lama (material, androidx.core, activity-ktx, lifecycle-*-ktx)
      # dicabut 2026-10-28: alasannya — minSdk 21 dan compileSdk 36 — sudah
      # tidak berlaku sesudah proyek naik ke minSdk 23 + compileSdk 37
      # (PR #116, issue #180).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
